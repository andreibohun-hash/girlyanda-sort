<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Гирлянда: сортировка</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<style>
/* Шрифт файлом (§1): Nunito, латиница + кириллица. */
@font-face{font-family:Nunito;font-weight:200 1000;font-display:swap;src:url('assets/nunito-latin.woff2') format('woff2');
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;font-weight:200 1000;font-display:swap;src:url('assets/nunito-cyr.woff2') format('woff2');
  unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
/* Палитра — одно место; canvas читает цвета через getComputedStyle (PROTO-BASE §9).
   Сцена тёмная в обеих темах: всё внимание на лампы и свет; светлая тема меняет только подложку вокруг кадра. */
:root{
  --bg:#03040a; --frame:#070914; --ink:#fff8ec; --muted:#b9b6cc; --ink-dark:#3a2410;
  --accent:#ffcf33; --accent2:#ff9a3c; --danger:#ff6b6b;
  /* цвета свечения ламп = цвета спрайтов bulb-on-*: красный, синий, зелёный, жёлтый, фиолетовый, тёплый белый */
  --c0:#ff4f5e; --c1:#3fb8ff; --c2:#57d977; --c3:#ffcf33; --c4:#b77bff; --c5:#ffe9c4;
  --c6:#eadcff;                              /* перламутровая лампа-джокер: основа, перелив — PEARL в коде */
  --ice:#cfeeff; --gold:#ffd24a;             /* иней и золотой патрон */
  --warm:#fff1c2;
  --sky1:#0b0f24; --sky2:#04050c;            /* фон: вертикальный градиент, без деталей */
  --wire:#2a5a40; --wire-hi:#6fae82; --wire-gold:#ffd772; --socket:#3b4258;
  --glass:#aebcff; --glass-fill:#141a33;
  --card1:#241d44; --card2:#131029;
  --frame-w:440px;                           /* расчётная ширина кадра (CFG.FRAME_W) */
  --fk:1;                                    /* масштаб кадра: fitFrame() растягивает его на высоком портретном окне шире расчётного */
}
@media (prefers-color-scheme: light){ :root{ --bg:#15172a; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 Nunito, system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
/* Кадр: расчётная ширина до --frame-w. Если окно шире и портретное (телефон в режиме «версия для ПК» отдаёт ширину 980 px, планшет),
   кадр остаётся расчётной ширины и целиком масштабируется на --fk — игра занимает окно, а не узкую колонку; на десктопе (альбом) --fk = 1.
   --sat/--sab — безопасные зоны в единицах кадра (делятся на масштаб). */
#frame{position:relative;width:min(100vw,var(--frame-w));height:100vh;height:calc(100dvh / var(--fk));height:calc(100svh / var(--fk));margin:0 auto;background:var(--frame);overflow:hidden;
  transform-origin:50% 0;--sat:calc(env(safe-area-inset-top, 0px) / var(--fk));--sab:calc(env(safe-area-inset-bottom, 0px) / var(--fk))}
#frame.zoom{transform:scale(var(--fk))}
#frame.narrow header{gap:5px;padding-left:8px;padding-right:8px} #frame.narrow header .pill{padding:6px 10px;font-size:13.5px} #frame.narrow .ib{width:36px;height:36px} #frame.narrow .ib svg{width:20px;height:20px} #frame.narrow #hud-moves .lbl{display:none}
#sa{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:var(--sat);padding-bottom:var(--sab)}
#game{position:absolute;inset:0;touch-action:none;-webkit-touch-callout:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:7px;padding:calc(8px + var(--sat)) 10px 0;pointer-events:none;z-index:3}
header .pill{background:rgba(16,18,40,.7);border:1.5px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 13px;font-weight:900;font-size:15px;letter-spacing:.01em;white-space:nowrap}
header .pill.dim{color:var(--muted);font-weight:800}
header .sp{flex:1}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;background:rgba(16,18,40,.7);border:1.5px solid rgba(255,255,255,.16)}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ib.off .wave{display:none} .ib:not(.off) .mutex{display:none}
.ib:active{transform:scale(.92)}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:0 12px calc(12px + var(--sab));pointer-events:none;z-index:3}
footer button{pointer-events:auto;background:rgba(22,24,52,.86);border:1.5px solid rgba(255,255,255,.16);border-radius:999px;padding:10px 18px;font-size:15px;display:flex;align-items:center;gap:7px}
footer button svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
footer button[disabled]{opacity:.35}
footer button:active{transform:scale(.95)}
button{font:inherit;font-weight:900;color:var(--ink);background:#2f2859;border:0;border-radius:16px;padding:11px 18px;cursor:pointer}
button.primary{background:linear-gradient(#ffe066,#ffb22e);color:var(--ink-dark);box-shadow:0 4px 0 #b86e12, 0 8px 18px rgba(255,170,40,.35)}
button.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #b86e12}
button.big{font-size:20px;padding:14px 34px;border-radius:20px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(8,8,24,.3),rgba(2,2,10,.8));padding:22px;z-index:5}
#overlay.show{display:flex}
.card{background:linear-gradient(var(--card1),var(--card2));border:2px solid rgba(255,214,120,.32);border-radius:26px;padding:22px 20px;max-width:340px;width:100%;text-align:center;
  box-shadow:0 0 0 6px rgba(255,214,120,.05),0 20px 50px rgba(0,0,0,.55);animation:pop .28s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow-y:auto} /* стартует с видимого состояния (§9) */
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.card h2{margin:0 0 6px;font-size:27px;font-weight:1000;color:var(--accent);text-shadow:0 2px 0 #6b3a08}
.card p{color:var(--muted);margin:0 0 14px;font-weight:700}
.logo{font-size:38px;font-weight:1000;line-height:1.02;margin:2px 0 4px;background:linear-gradient(90deg,#ff4f5e,#ffcf33,#57d977,#3fb8ff,#b77bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.sub{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:800;letter-spacing:.02em}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* переключатель вариантов A/B */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#17132f;border-radius:18px;padding:5px;margin:0 0 14px}
.seg button{padding:9px 4px 8px;border-radius:14px;background:transparent;color:var(--muted);font-size:15px;line-height:1.15}
.seg button small{display:block;font-size:11px;font-weight:800;opacity:.85}
.seg button.on{background:#3a2f6c;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,214,120,.45)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 4px}
.levels button{padding:8px 0 6px;font-size:17px;border-radius:14px;background:#3a2f6c;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:44px;justify-content:center}
.levels button small{font-size:10px;line-height:10px;height:10px;display:block}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 1px}
.levels button.locked{opacity:.32}
.levels button.cur{outline:2.5px solid var(--accent)}
.levels.many{grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0 2px}
.levels.many button{font-size:15px;min-height:37px;padding:5px 0 3px;border-radius:11px}
.levels button.gold{box-shadow:inset 0 0 0 2px var(--gold)}
.levels button.new{background:#4a3a86;position:relative}  /* уровень, где впервые встречается механика: в углу её значок */
.levels .mi{position:absolute;right:-2px;top:-6px;width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.levels i.mi{width:11px;height:11px;right:0;top:-4px;border-radius:4px;background:linear-gradient(#ff4f5e,#b77bff);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.goldrow.total{margin:8px 0 2px;font-size:14px} .goldrow.total img{width:20px;height:20px}
.cheat.sure{border-style:solid;border-color:var(--danger);color:var(--danger)}
/* лампочка-подсказка мигает, когда игрок давно не ходил; толчок кнопки запасного провода при первом показе. Обе анимации стартуют с видимого состояния (§9) */
.ib.nudge{animation:nudge 1.5s ease-in-out infinite} .ib.nudge svg{stroke:var(--accent)}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(255,207,51,0)}50%{box-shadow:0 0 0 6px rgba(255,207,51,.3)}}
footer button.pulse{animation:pulse .8s ease-in-out 2}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,241,194,0)}50%{transform:scale(1.09);box-shadow:0 0 0 7px rgba(255,241,194,.28)}}
.goldrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:-4px 0 12px;color:var(--gold);font-weight:900}
.goldrow img{width:24px;height:24px;object-fit:contain}
.goldrow.miss{color:var(--muted)} .goldrow.miss img{filter:grayscale(1);opacity:.55}
.how.mech{list-style:none;padding-left:0;font-size:14px} .how.mech li{display:flex;gap:8px;align-items:flex-start;margin:7px 0}
.how.mech img,.how.mech i{flex:0 0 24px;width:24px;height:24px;object-fit:contain;margin-top:1px}
.how.mech i{border-radius:7px;background:linear-gradient(#ff4f5e,#b77bff);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
/* замок — CSS-формой, не глифом (глиф вне шрифта = кадр 1 с) */
.lock{width:12px;height:10px;border-radius:2px;background:var(--muted);position:relative;margin-top:7px}
.lock:before{content:"";position:absolute;left:2px;top:-7px;width:8px;height:8px;border:2px solid var(--muted);border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box}
.ver{margin-top:8px;font-size:11px;color:var(--muted);opacity:.6;font-weight:800}
.cheat{margin-top:8px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted);border-radius:12px}
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.star{width:52px;height:52px;background:#40376c;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:linear-gradient(#fff2a8,#ffcf33 55%,#ff9a3c);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.stars .star:nth-child(2){transform:translateY(-8px)}
@keyframes starIn{from{transform:scale(1.6) rotate(-20deg)}to{transform:scale(1)}}
.stars .star.on:nth-child(2){animation-name:starIn2}
@keyframes starIn2{from{transform:translateY(-8px) scale(1.6) rotate(-20deg)}to{transform:translateY(-8px) scale(1)}}
.how{text-align:left;color:var(--muted);margin:0 0 16px;padding-left:20px;font-weight:700} .how li{margin:6px 0} .how b{color:var(--ink)}
#toast{position:absolute;left:50%;top:calc(60px + var(--sat));transform:translateX(-50%);background:rgba(255,248,230,.96);color:var(--ink-dark);padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;white-space:nowrap;z-index:4;font-weight:900;font-size:14px}
#toast.hide{opacity:0}
@media (prefers-reduced-motion: reduce){ .card,.star.on,.ib.nudge,footer button.pulse{animation:none} .ib.nudge{box-shadow:0 0 0 4px rgba(255,207,51,.3)} #toast{transition:none} }
</style>
</head>
<body>
<div id="frame">
  <i id="sa"></i>
  <div id="game"><canvas id="cv"></canvas></div>
  <header>
    <span class="pill" id="hud-level">Уровень 1</span><span class="pill dim" id="hud-moves"><span class="lbl">ходы </span><span id="hud-moves-n">0</span></span><span class="sp"></span>
    <button class="ib" id="btn-hint" aria-label="подсказка"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
    <button class="ib" id="btn-reset" aria-label="заново"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg></button>
    <button class="ib" id="btn-mute" aria-label="звук"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mutex" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
    <button class="ib" id="btn-menu" aria-label="меню"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  </header>
  <footer>
    <button id="btn-undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg>Отмена</button>
    <button id="btn-spare"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="spare-label">провод</span></button>
  </footer>
  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="toast" class="hide"></div>
</div>
<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Гирлянда: сортировка» — сортировка лампочек, два варианта правил (RULES):
//   a «Провода» — как Bird Sort: лампы висят на проводах, крайняя у свободного конца — «верхняя».
//       Ход: с провода снимается вся крайняя группа ламп одного цвета и перелетает на другой провод,
//       если он пуст или его крайняя лампа того же цвета; влезает столько, сколько есть места.
//       Провод, на котором собрались все лампы цвета (и только они), загорается и гирлянда улетает — провод свободен.
//   b «Колбы» — классическая сортировка шариков: лампы стопкой в колбах, за ход переносится одна верхняя лампа
//       на пустую колбу или на лампу того же цвета. Собранная колба загорается и запирается (остаётся на месте).
// Провод/колба = «контейнер»: строка цифр-цветов от закреплённого конца (дна) к свободному, caps[i] — вместимость.
// Победа — собраны все цвета. Проигрыша нет: тупик лечится отменой, запасным контейнером (бустер) или рестартом.
// Контракт для sim.mjs/test.mjs: CFG, RULES, LEVELS, mulberry32, createState, legalMoves, applyMove, undoMove,
// addSpare, isWin, isStuck, solveInfo, solve, hintMove, starsFor, randomRun, noviceRun.
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила ---
  START_MAX_RUN: 2,       // на старте в контейнере подряд не больше стольких ламп одного цвета (тройка — почти готовый цвет даром)
  SPARE_PER_LEVEL: 1,     // сколько запасных контейнеров можно добавить за уровень (бустер «+ провод / + колба»)
  STAR3_K: 1.3,           // 3 звезды: ходов ≤ par × STAR3_K (par — минимум солвера, записан в LEVELS)
  STAR2_K: 1.8,           // 2 звезды: ходов ≤ par × STAR2_K
  // --- солвер и боты ---
  SOLVE_NODES: 500000,    // лимит узлов A* в симуляторе (точный par)
  HINT_NODES: 30000,      // лимит узлов для подсказки в игре (взвешенный A*, быстро и не обязательно кратчайше)
  HINT_WEIGHT: 2,         // вес эвристики для подсказки
  BOT_MOVE_CAP: 160,      // бот сдаётся после стольких ходов
  // --- раскладка, виртуальные юниты при ширине кадра 400 ---
  VW: 400,                // виртуальная ширина кадра
  BULB_R: 14,             // «радиус» лампы: высота спрайта = R × BULB_H_K
  BULB_H_K: 3.1,          // высота спрайта лампы в радиусах
  BULB_HOOK_K: 0.12,      // доля высоты спрайта над точкой подвеса (цоколь заходит на провод)
  A_TOP: 122,             // вариант a: верх поля (под итоговой гирляндой), от верха кадра
  A_BOTTOM: 74,           // вариант a: отступ поля от низа кадра (кнопки)
  A_ROW_MIN: 66, A_ROW_MAX: 104,  // высота ряда проводов
  A_WALL: 20,             // отступ первой лампы от стены
  A_STEP: 40, A_STEP5: 33,        // шаг ламп на проводе при вместимости ≤4 и 5
  A_SAG: 5,               // провис провода
  A_LIFT: 14,             // на сколько приподнимаются выбранные лампы
  TOP_Y: 78,              // итоговая гирлянда сверху: высота подвеса
  TOP_SAG: 16,            // её провис
  TOP_SCALE: 0.56,        // масштаб ламп на итоговой гирлянде
  B_TOP: 112, B_BOTTOM: 78,       // вариант b: поле
  B_TUBE_W: 40,           // внутренняя ширина колбы
  B_SLOT: 37,             // шаг ламп в колбе по высоте
  B_GAP: 26,              // зазор между колбами
  B_LIFT: 6,              // зазор между горлышком и приподнятой лампой
  B_BULB_R: 13.5,         // «радиус» лампы в колбе
  B_ROW_GAP: 58,          // зазор между рядами колб (место под приподнятую лампу)
  HIT_PAD: 12,            // запас зоны попадания вокруг контейнера
  FRAME_W: 440,           // расчётная ширина кадра, CSS px (то же число в --frame-w)
  FRAME_MIN_H: 720,       // кадр, растянутый на широкое портретное окно, не становится ниже этой расчётной высоты (иначе берётся масштаб по высоте)
  FRAME_NARROW: 410,      // кадр уже этого — компактная шапка
  CANVAS_MAX_W: 1100,     // потолок ширины холста в пикселях устройства: окно 980 px × DPR 2 дало бы холст на 8 Мп
  // --- ввод (всё в виртуальных юнитах: в окне «версии для ПК» CSS-пиксель втрое мельче пальца) ---
  DRAG_PX: 10,            // порог тап/драг: сдвинул палец дальше — лампы пошли за пальцем
  DRAG_ARM: 26,           // перетаскивание «взведено», когда палец ушёл от точки касания дальше этого; до того отпускание = тап (лампы остаются приподнятыми)
  DRAG_GAP: 26,           // зазор между пальцем и низом несомой лампы (лампа видна над пальцем)
  DRAG_GRAB_MS: 90,       // подхват: за столько лампы приходят с провода к пальцу, дальше идут за ним жёстко
  DROP_SNAP_K: 0.8,       // радиус прилипания к подходящему проводу, в высотах ряда: лампа ближе — провод подсвечен, отпустил — сели
  DROP_BIAS_K: 0.2,       // фора подходящему проводу перед неподходящим соседом, в высотах ряда
  DROP_FINGER_PEN: 12,    // провод под самим пальцем тоже считается, но со штрафом: при прочих равных решает лампа

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// --- состояние ---

    sc += rnd() * 6;

const tw = (a) => ({ a, b: a, t0: 0, d: 1 });
const twVal = (x, t) => x.a + (x.b - x.a) * ease((t - x.t0) / x.d);

function after(ms, fn){                              // событие через ms игрового времени
  const ev = { at: now() + dur(ms), fn }; let i = G.events.length;

// --- раскладка: всё в виртуальных юнитах при ширине VW (§2) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = CFG.VW;
let scale = 1, W = VW, H = 640, DPR = 1;
const SAFE = { top: 0, bottom: 0 };                  // безопасные зоны экрана (чёлка, полоска жестов) в виртуальных юнитах — поле и итоговая гирлянда отступают на них

const spareOpen = (s) => s.li >= CFG.SPARE_FROM_LEVEL - 1;
// layout(): места контейнеров. Место под запасной контейнер зарезервировано заранее (призрак) — поле не прыгает.
function layout(){
  const s = G.s; if (!s) return;
  const n = s.caps.length, ghost = s.spare < CFG.SPARE_PER_LEVEL && spareOpen(s) ? 1 : 0, N = n + ghost;
  const capOf = (i) => i < n ? s.caps[i] : s.per;

    // провода растут от левой и правой стены в шахматном порядке, как ветки
    const rows = Math.ceil(N / 2), top = CFG.A_TOP + SAFE.top, bottom = H - CFG.A_BOTTOM - SAFE.bottom;
    const rowH = Math.max(CFG.A_ROW_MIN, Math.min(CFG.A_ROW_MAX, (bottom - top) / (rows + 0.5)));
    const y0 = top + Math.max(0, (bottom - top - (rows + 0.5) * rowH) * 0.5);     // поле по центру свободной высоты: ближе к большому пальцу, чем к шапке
    GEO.r = CFG.BULB_R; GEO.rowH = rowH; GEO.k = 1;

      const side = i % 2, row = (i - side) / 2, cap = capOf(i), step = cap >= 5 ? CFG.A_STEP5 : CFG.A_STEP;
      GEO.cont.push({ i, side, dir: side ? -1 : 1, x0: side ? W : 0, y: y0 + rowH * 0.3 + row * rowH + (side ? rowH * 0.5 : 0), cap, step, len: CFG.A_WALL + cap * step + 8 });
    }
  } else {
    // колбы в один или два ряда, донышки по линии; всё поле сжимается коэффициентом k, если не влезает по высоте
    const perRow = N <= 5 ? N : Math.ceil(N / 2), rows = N <= 5 ? 1 : 2, top = CFG.B_TOP + SAFE.top, bottom = H - CFG.B_BOTTOM - SAFE.bottom;

const bulbH = () => GEO.r * CFG.BULB_H_K;

function sagOf(i){ const k = V.kick[i]; if (!k) return CFG.A_SAG; const tau = (now() - k.t0) / dur(CFG.KICK_MS); if (tau >= 1){ delete V.kick[i]; return CFG.A_SAG; } return CFG.A_SAG + k.amp * Math.exp(-4.5 * tau) * Math.sin(tau * 17); }
function kick(i, amp){ if (G.s && G.s.v === 'a' && i >= 0) V.kick[i] = { t0: now(), amp: REDUCED ? 0 : amp }; }
function wireY(c, d){ const u = d / c.len; return c.y + 4 * sagOf(c.i) * u * (1 - u); }       // провис провода
// slotPos: точка подвеса лампы (цоколь) в ячейке si контейнера ci
function slotPos(ci, si){
  const c = GEO.cont[ci]; if (!c) return { x: W / 2, y: H / 2 };
  if (G.s.v === 'a'){ const d = CFG.A_WALL + (si + 0.5) * c.step; return { x: c.x0 + c.dir * d, y: wireY(c, d) }; }

// mouthPos: точка подвеса лампы, висящей над горлышком колбы (вариант b)
function mouthPos(ci){ const c = GEO.cont[ci]; return { x: c.x, y: c.yBot - c.h - CFG.B_LIFT * GEO.k - bulbH() * (1 - CFG.BULB_HOOK_K) }; }

function topPos(q){

function wireEnd(i){ const g = GEO.cont[i]; return g && g.dir ? { x: g.x0 + g.dir * (g.len - 7), y: g.y + 1 } : { x: W / 2, y: H / 2 }; }

function contCenter(ci){
  const c = GEO.cont[ci]; if (!c) return { x: W / 2, y: H / 2 };
  if (G.s.v === 'a') return { x: c.x0 + c.dir * c.len * 0.5, y: c.y + 16 };
  return { x: c.x, y: c.yBot - c.h / 2 };

function containerAt(p){
  if (!G.s) return -1;
  let best = -1, bd = 1e9;
  for (const c of GEO.cont){
    let d;
    if (G.s.v === 'a'){
      if ((c.side === 0) !== (p.x < W / 2)) continue;
      d = Math.abs(p.y - (c.y + 14)); if (d > GEO.rowH * 0.5) continue;
    } else {
      d = Math.abs(p.x - c.x); if (d > GEO.tw / 2 + CFG.HIT_PAD + 3) continue;
      if (p.y < c.yBot - c.h - CFG.B_ROW_GAP * GEO.k * 0.9 || p.y > c.yBot + CFG.HIT_PAD) continue;
    }
    if (d < bd){ bd = d; best = c.i; }
  }
  return best >= 0 && best === GEO.ghost ? SPARE : best;
}

// --- визуальная модель ламп ---
let lampSeq = 0;
// v — значение лампы из ядра (цвет + флаги). ice/hid/gold — что лампа показывает сейчас; iceT/revT/goldT — моменты, когда
// иней начал таять, тёмная открылась, золотой патрон погас (переходы — функции абсолютного времени).
function mkLamp(v, ci, si){
  return { id: lampSeq++, col: v & COLOR, ice: !!(v & ICE), hid: !!(v & HID), gold: !!(v & GOLD), iceT: -1e9, revT: -1e9, goldT: -1e9,
    ci, si, top: -1, landed: true, fly: null, flyId: 0, lift: tw(0), lit: tw(0), sc: tw(1),
    landT: -1e9, landDir: 1, kissT: -1e9, kissDir: 0, flashT: -1e9, flashK: 0, popT: -1e9, popK: 0, noT: -1e9, grp: null, px: 0, py: 0, dragX: null, dragY: null, dragFrom: null, landCb: null };   // landCb — что сделать, когда полёт закончится (см. lampPose)   // popT/popK — толчок масштаба, noT — качает «нет», grp — гирлянда, в которой лампа доигрывает сбор
}
// яркость лампы по длине её группы: одиночная не горит, пара загорается, собранный цвет — в полную силу
function litLevel(L, per){ return L < 2 ? CFG.LIT_SINGLE : CFG.LIT_PAIR + (1 - CFG.LIT_PAIR) * (L - 2) / Math.max(1, per - 2); }
function relight(ci, t, instant){ relightArr(V.cont[ci], t, instant); }
// Свет провода (решение Андрея 13.11, плейтест): горит провод, на котором ВСЕ лампы одного цвета (от двух ламп);
// если на проводе есть чужой цвет или тёмная лампа — не горит ничего. Яркость растёт с числом ламп до собранного цвета.
// (Раньше: горела любая пара соседок → закрытые пары в середине сбивали; потом «ток от розетки» — цепочка от основания.)
function relightArr(arr, t, instant){
  if (!arr) return;
  let n = 0; while (n < arr.length && arr[n].landed) n++;          // летящие лампы — в хвосте, пока не считаются
  const pure = n >= 2 && arr.slice(0, n).every(l => !l.hid && l.col === arr[0].col);
  const v = pure ? litLevel(n, perOf(G.s, arr[0].col)) : CFG.LIT_SINGLE;
  for (let q = 0; q < arr.length; q++){
    const want = q < n ? v : CFG.LIT_SINGLE;
    if (instant) arr[q].lit = tw(want); else if (arr[q].lit.b !== want) twTo(arr[q].lit, want, t, CFG.LIT_MS);

// syncVisual: собрать визуальную модель заново из состояния ядра (старт уровня, отмена)
function syncVisual(){
  const s = G.s, t = now();
  V.cont = s.tubes.map((str, i) => Array.from(str, (ch, j) => { const l = mkLamp(lampAt(str, j), i, j); if (i === s.ice) l.ice = true; return l; }));   // на обледеневшем проводе в инее все лампы
  V.top = []; V.capT = {}; V.goldT = {}; V.bornT = {}; V.gone = []; V.pending = 0; V.kick = {}; V.curT = {}; V.birdDue = 0; G.no = null; G.inputT = t;
  V.bird = s.bird >= 0 ? { at: s.bird, from: -1, t0: 0, d: 1 } : null; V.iceWire = s.ice; V.iceWireT = {}; G.spot = null; G.rays = []; G.handCache = null;

  else s.tubes.forEach((str, i) => { if (isComplete(str, s.per)) V.capT[i] = -1e9; });

  for (let i = 0; i < V.cont.length; i++) relight(i, t, true);

function selLamps(){ if (G.sel < 0 || !V.cont[G.sel]) return []; const arr = V.cont[G.sel]; return arr.slice(Math.max(0, arr.length - G.selN)); }
// lampPose: где лампа сейчас — { x, y, ang, sc }. Всё — функции абсолютного времени.
function lampPose(l, t){
  const base = l.top >= 0 ? topPos(l.top) : slotPos(l.ci, l.si), isA = G.s.v === 'a';
  let x = base.x, y = base.y, ang = 0, sc = twVal(l.sc, t);
  const lift = twVal(l.lift, t), liftY = lift > 0.001 && l.top < 0 ? (isA ? CFG.A_LIFT : base.y - mouthPos(l.ci).y) * lift : 0;
  const dg = G.drag;
  if (dg && l.ci === G.sel && l.top < 0 && !l.grp && l.si >= V.cont[l.ci].length - G.selN){     // перетаскивание: группа веером над пальцем
    // Подхват за DRAG_GRAB_MS (от места, где лампу застало касание, — хоть в полёте), дальше лампа идёт за пальцем жёстко, в тот же кадр:
    // «догоняние» читается как вязкость, а цель выбирается по лампе — она должна быть там, где её видит игрок.
    const q = l.si - (V.cont[l.ci].length - G.selN), n = G.selN, k = ease((t - dg.t0) / dur(CFG.DRAG_GRAB_MS)), f = l.dragFrom || { x, y: y - liftY };
    const tx = dg.x + (q - (n - 1) / 2) * GEO.r * 2.1, ty = dg.y - CFG.DRAG_GAP - bulbH() * (1 - CFG.BULB_HOOK_K);

    l.dragX = l.px = x; l.dragY = l.py = y;

    else {

      const x0 = seg.from === 2 ? m.x : seg.x0, y0 = seg.from === 2 ? m.y : seg.y0, x1 = seg.to === 2 ? m.x : base.x, y1 = seg.to === 2 ? m.y : base.y - liftY;

// startFly: лампа летит из p0 на своё место (l.ci/l.si или l.top). kind: '' — перелёт на провод (в колбу — через горлышко),

    const d1 = d * 0.62, d2 = d * 0.38;                          // дуга до горлышка, потом падение в колбу
    l.fly = [{ x0: p0.x, y0: p0.y, t0, d: d1, arc: CFG.FLY_ARC * 0.55, ease: easeIO, to: 2 }, { from: 2, t0: t0 + d1, d: d2, arc: 0, ease: easeIn, to: 1 }];

// hurry: лампу тронули в полёте (выбрали её провод) — она не доигрывает дугу, а за FLY_HURRY_MS приходит на место, уже приподнятая.

function hurry(l){
  if (!l.fly) return;

  if (!l.fly) return;

// --- частицы и кольца: положение считается от t0 аналитически (абсолютное время, §4) ---
function burst(x, y, cols, n, speed, opt){

// --- уровень и ходы ---

}
function hud(){

}
const canInput = () => G.s && G.screen === 'game' && !G.ending && now() >= G.lockUntil;
// liftWhy: почему с провода нельзя снять лампы — 'bird' | 'ice' | 'frost' | '' (можно или провод пуст)
function liftWhy(ci){ const s = G.s, t = s.tubes[ci]; if (!t || !t.length) return ''; return s.bird === ci ? 'bird' : s.ice === ci ? 'ice' : (topLamp(t) & ICE) ? 'frost' : ''; }
const liftable = (ci) => ci >= 0 && G.s.tubes[ci] && G.s.tubes[ci].length > 0 && !liftWhy(ci) && !(!RULES[G.s.v].leave && isComplete(G.s.tubes[ci], G.s.per));
function noteInput(){ G.idleT = G.inputT = now(); if (G.hint && G.hint.auto) G.hint = null; }
function select(ci, quiet){
  const t = now();

  G.sel = ci; G.selN = 0;
  if (ci >= 0){
    settle(ci);
    G.selN = RULES[G.s.v].group ? topRun(G.s.tubes[ci]) : 1;
    for (const l of selLamps()){ twTo(l.lift, 1, t, 150); hurry(l); }
    kick(ci, -2.2);                                        // провод облегчённо подпрыгивает
    if (!quiet) Sound.pick(G.selN);

}
// bad: отказ — отклик по причине: птица чирикает и показывает, куда полетит; лёд звенит; патрон вспыхивает силуэтами (провод трясётся);
// чужой цвет или нет места — мягко, без тряски: видно, какие две лампы не сошлись (noFx). from — провод, с которого несли лампы.
function bad(ci, why, from){
  const soft = why === 'color' || why === 'full';

  buzz(soft ? 12 : 30); log('fx.start', 'bad', 'c=' + ci + (why ? ' why=' + why : ''));
  const bk = why === 'frost' ? 'frost' : why === 'ice' ? 'iceWire' : why === 'bird' ? 'bird' : '';

// noFx: мягкий отказ. Чужой цвет — поднятая лампа и крайняя на проводе качают «нет», вокруг каждой кольцо её цвета (drawNo): видно, что не сошлось.

// settle: игрок тронул провод, на котором эффект ещё не доигран (ядро уже впереди: иней растаял, птица улетела) — доиграть сразу,

function settle(ci){

// Тап по контейнеру: выбрать, снять выбор, перенести или переключить выбор.
function tapContainer(ci){

  noteInput();
  if (ci === SPARE){ useSpare(); return true; }
  if (ci < 0){ if (G.sel >= 0) select(-1); return false; }
  if (G.sel < 0){ if (liftable(ci)) select(ci); else if (liftWhy(ci)) bad(ci, liftWhy(ci)); return true; }
  if (G.sel === ci){ select(-1); return true; }
  if (canMove(G.s, G.sel, ci)) return doMove(G.sel, ci);
  bad(ci, whyNot(G.s, posOf(G.s), G.sel, ci), G.sel);
  if (liftable(ci)) select(ci, true); else select(-1);
  return false;
}
// Ход: ядро меняет состояние сразу, лампы долетают по своей очереди событий.
function doMove(a, b){

  G.lasts.push(last);

  G.sel = -1; G.selN = 0; G.hint = null; G.idleT = G.inputT = t;
  const flyMs = CFG.FLY_MS;

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
// fitFrame: масштаб кадра. Окно не шире расчётного кадра (обычный телефон) или альбомное (десктоп) — масштаб 1, как раньше.

window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);

  lessonMove(){ return lessonMove(); },
  // probe(settled): сверка для стендов — визуальная модель против ядра, выбор, рука урока. Возвращает список расхождений (пусто = всё сходится).
  // Сверять можно в любой момент: ядро и картинка обязаны сходиться и посреди полёта, и посреди сбора гирлянды.
  // settled = true — ещё и «всё доиграно»: ни одной лампы в полёте, все на своих местах, сборы закончены.
  probe(settled){
    const s = G.s, out = [], t = now(); if (!s) return out;
    if (V.cont.length !== s.tubes.length) out.push('контейнеров ' + V.cont.length + ' ≠ ' + s.tubes.length);
    s.tubes.forEach((str, i) => { const arr = V.cont[i] || []; if (arr.length !== str.length) out.push('провод ' + i + ': ламп ' + arr.length + ' ≠ ' + str.length); else for (let j = 0; j < str.length; j++){ if (arr[j].col !== colAt(str, j)) out.push('провод ' + i + ':' + j + ' цвет'); if (arr[j].ci !== i || arr[j].si !== j) out.push('провод ' + i + ':' + j + ' лампа числится на ' + arr[j].ci + ':' + arr[j].si); } });
    for (const arr of V.cont) for (const l of arr) if (!isFinite(l.px) || !isFinite(l.py)) out.push('лампа без места');
    if (G.lasts.length !== s.hist.length) out.push('история оболочки ' + G.lasts.length + ' ≠ истории ядра ' + s.hist.length);
    if (RULES[s.v].leave){ const want = s.done.reduce((n, c) => n + perOf(s, c), 0), have = V.top.length + V.gone.reduce((n, q) => n + q.arr.length, 0); if (want !== have) out.push('собрано ламп ' + have + ' ≠ ' + want); }
    if (V.gone.length > V.pending) out.push('гирлянд в сборе ' + V.gone.length + ' > ожидаемых ' + V.pending);
    if (G.sel >= s.tubes.length || (G.sel >= 0 && !s.tubes[G.sel].length)) out.push('выбран пустой или несуществующий провод ' + G.sel);
    if (G.sel >= 0 && RULES[s.v].group && G.selN !== topRun(s.tubes[G.sel])) out.push('приподнято ' + G.selN + ' ламп, крайняя группа — ' + topRun(s.tubes[G.sel]));
    if (G.drag && G.sel < 0) out.push('перетаскивание без выбранного провода');
    if (G.drag && G.drag.over >= 0 && !canMove(s, G.sel, G.drag.over)) out.push('подсвечен провод ' + G.drag.over + ', куда лампы сесть не могут');
    if (G.sel < 0 && !G.drag) for (const arr of V.cont) for (const l of arr) if (l.lift.b > 0) out.push('лампа осталась приподнятой');
    if (G.hint && G.hint.auto && !canMove(s, G.hint.a, G.hint.b)) out.push('рука урока показывает невозможный ход ' + G.hint.a + '>' + G.hint.b);
    if (V.bird && !flyingBird() && t >= V.birdDue && V.pending === 0 && V.bird.at !== s.bird) out.push('птица нарисована на ' + V.bird.at + ', в ядре ' + s.bird);
    if (settled){
      if (V.pending || V.gone.length) out.push('сбор не доигран: pending ' + V.pending + ', gone ' + V.gone.length);
      const all = [].concat(...V.cont, V.top);
      for (const l of all){
        if (!l.landed || l.fly){ out.push('лампа всё ещё в полёте (' + l.ci + ':' + l.si + ' top ' + l.top + ')'); break; }
        const p = lampPose(l, t), b = l.top >= 0 ? topPos(l.top) : slotPos(l.ci, l.si), up = l.top < 0 && l.ci === G.sel ? 40 : 0;
        if (Math.abs(p.x - b.x) > 6 || p.y - b.y > 6 || b.y - p.y > 6 + up){ out.push('лампа не на месте (' + l.ci + ':' + l.si + ' top ' + l.top + '): ' + Math.round(p.x) + ',' + Math.round(p.y) + ' ≠ ' + Math.round(b.x) + ',' + Math.round(b.y)); break; }
      }
    }
    if (G.frameErrors) out.push('ошибок кадра ' + G.frameErrors + ': ' + G.lastError);
    return out;
  },
  // aim(): на сколько (в виртуальных юнитах) середина несомой лампы выше пальца — стенд ведёт палец так, чтобы лампа пришла на провод
  aim(){ return { dy: CFG.DRAG_GAP + bulbH() * 0.5, arm: CFG.DRAG_ARM }; },
  // frame(): рамка — окно, масштаб кадра, размер холста, безопасные зоны
  frame(){ const f = $('frame').getBoundingClientRect(); return { window: [window.innerWidth, window.innerHeight], k: frameK, frame: [Math.round(f.width), Math.round(f.height)], canvas: [cv.width, cv.height], dpr: DPR, scale, safe: Object.assign({}, SAFE) }; },
  // safe(top, bottom): подставить безопасные зоны (CSS px окна), как на телефоне с чёлкой и полоской жестов; без аргументов — вернуть настоящие
  safe(top, bottom){ const f = $('frame'); if (top === undefined){ f.style.removeProperty('--sat'); f.style.removeProperty('--sab'); } else { f.style.setProperty('--sat', 'calc(' + top + 'px / var(--fk))'); f.style.setProperty('--sab', 'calc(' + (bottom || 0) + 'px / var(--fk))'); } fit(); return Object.assign({}, SAFE); },
  forget(kind){ if (kind) delete G.save.seen[kind]; else G.save.seen = {}; save(); return Object.assign({}, G.save.seen); },   // забыть уроки (все или один) — пройти обучение заново
  why(a, b){ return G.s ? (b === undefined ? liftWhy(a) : whyNot(G.s, posOf(G.s), a, b)) : ''; },
  drive(sec){                                   // ручной прогон игрового времени: rAF заморожен в скрытой вкладке
    const steps = Math.ceil(sec * 1000 / 16);
    for (let i = 0; i < steps; i++){ clockSkew += 16; render(); }
    return this.state();
  },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  unlockAll(on){ setUnlockAll(on === undefined ? true : on); if (G.screen === 'menu') goto('menu'); return G.save.unlockAll; },   // чит: открыть все уровни
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт ---
readPalette(); loadArt(); fit(); hud();
try { if (document.fonts && document.fonts.load) document.fonts.load('800 16px Nunito'); } catch (e) {}
route(location.hash.slice(1));
requestAnimationFrame(frame);
log('event', 'boot', 'v' + VERSION + ' variant=' + G.v + ' levels=' + LEVELS.a.length + '+' + LEVELS.b.length);
</script>
</body>
