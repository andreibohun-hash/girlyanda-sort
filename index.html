  /* объёмные кнопки (аудит UI 17.11): цвет по смыслу — зелёная «хорошее и спасительное», красная «сброс», нейтральная — остальное.
     top/bot — градиент лица, edge — «толщина» под кнопкой, на неё кнопка проседает при нажатии */
  --g-top:#8be86a; --g-bot:#34b33a; --g-edge:#1c7330; --g-ink:#ffffff;
  --r-top:#ff8a7a; --r-bot:#e8424a; --r-edge:#97202d; --r-ink:#ffffff;
  --n-top:#4c4794; --n-bot:#352f74; --n-edge:#1a163f; --n-ink:#fff8ec;
  --btn-edge:5px;                            /* высота «толщины» кнопки, px */
  --frame-w:440px;                           /* расчётная ширина кадра (CFG.FRAME_W) */
  --fk:1;                                    /* масштаб кадра: fitFrame() растягивает его на высоком портретном окне шире расчётного */
}
@media (prefers-color-scheme: light){ :root{ --bg:#15172a; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 Nunito, system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
/* Кадр: расчётная ширина до --frame-w. Если окно шире и портретное (телефон в режиме «версия для ПК» отдаёт ширину 980 px, планшет),
   кадр остаётся расчётной ширины и целиком масштабируется на --fk — игра занимает окно, а не узкую колонку; на десктопе (альбом) --fk = 1.
   --sat/--sab — безопасные зоны в единицах кадра (делятся на масштаб). */
#frame{position:relative;width:min(100vw,var(--frame-w));height:100vh;height:calc(100dvh / var(--fk));height:calc(100svh / var(--fk));margin:0 auto;background:var(--frame);overflow:hidden;
  transform-origin:50% 0;--sat:calc(env(safe-area-inset-top, 0px) / var(--fk));--sab:calc(env(safe-area-inset-bottom, 0px) / var(--fk))}
#frame.zoom{transform:scale(var(--fk))}
#frame.narrow header{gap:4px;padding-left:8px;padding-right:8px} #frame.narrow header .hl,#frame.narrow header .hr{gap:6px} #frame.narrow header .pill{padding:6px 13px 7px;font-size:16px}
#sa{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:var(--sat);padding-bottom:var(--sab)}
#game{position:absolute;inset:0;touch-action:none;-webkit-touch-callout:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Шапка (аудит UI 17.11): слева тихие пауза и звук, по центру номер уровня, справа подсказка (зелёная) и рестарт (красный).
   Счётчик ходов скрыт: без звёзд и рекорда цифра без подписи ничего не значит (элемент остался — журнал и стенды). */
header{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:calc(8px + var(--sat)) 10px 0;pointer-events:none;z-index:3}
header .hl,header .hr{display:flex;gap:8px;align-items:center} header .hr{justify-content:flex-end}
header .pill{background:rgba(16,18,40,.72);border:1.5px solid rgba(255,214,120,.28);border-radius:999px;padding:6px 16px 7px;font-weight:1000;font-size:17px;letter-spacing:.01em;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#hud-moves{display:none}
/* Объёмная кнопка: лицо — градиент, под ним «толщина» --btn-edge; при нажатии (класс .down с касания или :active) проседает на неё.
   Цвет — по смыслу: .go зелёная (Next, Resume, Undo, + wire, подсказка, Got it), .stop красная (Restart), без класса — нейтральная. */
button{font:inherit;font-weight:1000;color:var(--n-ink);border:0;border-radius:16px;padding:11px 18px;cursor:pointer;position:relative;
  --t:var(--n-top);--b:var(--n-bot);--e:var(--n-edge);
  background:linear-gradient(var(--t),var(--b));box-shadow:0 var(--btn-edge) 0 var(--e),0 calc(var(--btn-edge) + 5px) 12px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.28);
  transition:transform .06s,box-shadow .06s;margin-bottom:var(--btn-edge)}
button.go{--t:var(--g-top);--b:var(--g-bot);--e:var(--g-edge);color:var(--g-ink);text-shadow:0 2px 0 rgba(10,70,25,.45)}
button.stop{--t:var(--r-top);--b:var(--r-bot);--e:var(--r-edge);color:var(--r-ink);text-shadow:0 2px 0 rgba(110,15,25,.45)}
button:active,button.down{transform:translateY(calc(var(--btn-edge) - 1px));box-shadow:0 1px 0 var(--e),0 2px 4px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2)}
button[disabled]{--t:#3a3a55;--b:#2c2c44;--e:#17172a;color:rgba(255,248,236,.42);text-shadow:none;cursor:default}
button[disabled]:active,button[disabled].down{transform:none;box-shadow:0 var(--btn-edge) 0 var(--e)}
button[disabled] svg{stroke:rgba(255,248,236,.42)!important} button[disabled] .ad{display:none!important}
button.big{font-size:21px;padding:14px 34px;border-radius:20px}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;--btn-edge:4px}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ib.go{width:48px;height:48px} .ib.go svg{width:25px;height:25px;stroke:#fff;filter:drop-shadow(0 1.5px 0 rgba(10,70,25,.5))}
.ib.stop svg{stroke:#fff;filter:drop-shadow(0 1.5px 0 rgba(110,15,25,.5))}
.ib.off .wave{display:none} .ib:not(.off) .mutex{display:none}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;padding:0 12px calc(8px + var(--sab));pointer-events:none;z-index:3}
footer button{pointer-events:auto;border-radius:20px;padding:0 22px;height:54px;font-size:19px;display:flex;align-items:center;gap:8px;min-width:136px;justify-content:center}
footer button svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1.5px 0 rgba(10,70,25,.5))}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(8,8,24,.3),rgba(2,2,10,.8));padding:22px;z-index:5}
#overlay.show{display:flex}
.card{background:linear-gradient(#33296a,#1d1745);border:3.5px solid #f5b53a;border-radius:28px;padding:20px 20px 16px;max-width:340px;width:100%;text-align:center;
  box-shadow:inset 0 0 0 2px rgba(255,236,170,.25),0 0 0 4px rgba(20,12,4,.45),0 20px 50px rgba(0,0,0,.55);animation:pop .28s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow-y:auto} /* стартует с видимого состояния (§9) */
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
/* победа салютом (17.11, как вин-скрин «Половинок»): ночное небо в оверлее, ракеты на холсте #sky под карточкой; сначала название игры, потом наша карточка */
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
#overlay{transition:background .35s} #overlay .card{position:relative;z-index:1}
#overlay.night{background:radial-gradient(120% 70% at 50% 100%,#2a1f5c 0%,#0e0b2a 55%,#05040f 100%)}
.card.sky{background:none;border:0;box-shadow:none;padding:0;animation:skyLogo .5s cubic-bezier(.25,1.6,.5,1) both;pointer-events:none}
.card.sky .logo{font-size:58px;line-height:1}
@keyframes skyLogo{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 4px;font-size:32px;line-height:1.08;font-weight:1000;color:#ffd84a;text-shadow:0 3px 0 #7a3b06,0 0 2px #7a3b06;letter-spacing:.005em}
.card p{color:#e3def5;margin:0 0 14px;font-weight:800;font-size:16.5px}
.card .col button{width:100%;display:flex;align-items:center;justify-content:center;gap:9px}
.card button svg{width:22px;height:22px;flex:0 0 22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.card button.go svg{filter:drop-shadow(0 1.5px 0 rgba(10,70,25,.45))} .card button.stop svg{filter:drop-shadow(0 1.5px 0 rgba(110,15,25,.45))}
.card button.quiet,.card button.cheat{box-shadow:none;margin-bottom:0;background:transparent;transform:none}
.card button.quiet{color:var(--muted);font-size:14px;padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
/* вин-карточка (аудит UI 17.11): без звёзд и счёта — заголовок, похвала, гирлянда собранных цветов загорается по одной */
.card .praise{font-size:21px;color:#fff;font-weight:1000;margin:0 0 4px}
.wl{position:relative;height:74px;margin:2px -6px 12px}
.wl svg.wire{position:absolute;left:0;top:0;width:100%;height:40px;overflow:visible}
.wl i{position:absolute;width:30px;height:46px;margin-left:-15px;background-size:contain;background-repeat:no-repeat;background-position:50% 0;transform-origin:50% 0;
  filter:brightness(.5) saturate(.55);animation:wlOn .5s cubic-bezier(.3,1.6,.5,1) var(--d) forwards,wlTw 2.6s ease-in-out calc(var(--d) + .6s) infinite}
@keyframes wlOn{0%{filter:brightness(.5) saturate(.55);transform:rotate(var(--r)) scale(.9)}55%{filter:brightness(1.7) saturate(1.1) drop-shadow(0 0 12px var(--c));transform:rotate(var(--r)) scale(1.12)}100%{filter:brightness(1.05) drop-shadow(0 0 8px var(--c));transform:rotate(var(--r)) scale(1)}}
@keyframes wlTw{0%,100%{filter:brightness(1.05) drop-shadow(0 0 8px var(--c))}50%{filter:brightness(1.3) drop-shadow(0 0 14px var(--c))}}
.logo{font-size:38px;font-weight:1000;line-height:1.02;margin:2px 0 4px;background:linear-gradient(90deg,#ff4f5e,#ffcf33,#57d977,#3fb8ff,#b77bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.sub{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:800;letter-spacing:.02em}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* переключатель вариантов A/B */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#17132f;border-radius:18px;padding:5px;margin:0 0 14px}
.seg button{box-shadow:none;margin-bottom:0;padding:9px 4px 8px;border-radius:14px;background:transparent;color:var(--muted);font-size:15px;line-height:1.15}
.seg button small{display:block;font-size:11px;font-weight:800;opacity:.85}
.seg button.on{background:#3a2f6c;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,214,120,.45)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 4px}
.levels button{margin-bottom:0;--btn-edge:3px;padding:8px 0 6px;font-size:17px;border-radius:14px;background:#3a2f6c;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:44px;justify-content:center}
.levels button small{font-size:10px;line-height:10px;height:10px;display:block}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 1px}
.levels button.locked{opacity:.32}
.levels button.cur{outline:2.5px solid var(--accent)}
.levels.many{grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0 2px}
.levels.many button{font-size:15px;min-height:37px;padding:5px 0 3px;border-radius:11px}
.levels button.gold{box-shadow:inset 0 0 0 2px var(--gold)}
.levels button.new{background:#4a3a86;position:relative}  /* уровень, где впервые встречается механика: в углу её значок */
.levels .mi{position:absolute;right:-2px;top:-6px;width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.levels i.mi{width:11px;height:11px;right:0;top:-4px;border-radius:4px;background:linear-gradient(#ff4f5e,#b77bff);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.goldrow.total{margin:8px 0 2px;font-size:14px} .goldrow.total img{width:20px;height:20px}
.cheat.sure{border-style:solid;border-color:var(--danger);color:var(--danger)}
/* лампочка-подсказка мигает, когда игрок давно не ходил; толчок кнопки запасного провода при первом показе. Обе анимации стартуют с видимого состояния (§9) */
/* кольцо вокруг кнопки — отдельным слоем, чтобы не сбивать «толщину» кнопки (box-shadow) */
.ib.nudge{animation:nudge 1.5s ease-in-out infinite}
.ib.nudge:before,footer button.pulse:before{content:"";position:absolute;inset:-6px;border-radius:inherit;border:3px solid rgba(255,241,160,.9);pointer-events:none;animation:ring 1.5s ease-out infinite}
footer button.pulse:before{animation:ring .8s ease-out 2 forwards}   /* forwards: после двух вспышек кольцо остаётся невидимым, а не повисает рамкой */
@keyframes nudge{0%,100%{scale:1}50%{scale:1.08}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.3);opacity:0}}
footer button.pulse{animation:pulse .8s ease-in-out 2}
.ib.stop.arm{scale:1.18;transition:scale .12s} .ib.stop.arm:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(255,140,130,.95);pointer-events:none;animation:ring .7s ease-out infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.09}}
.goldrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:-4px 0 12px;color:var(--gold);font-weight:900}
.goldrow img{width:30px;height:30px;object-fit:contain} .card.win .goldrow{font-size:17px;margin:0 0 14px}
.goldrow.miss{color:var(--muted)} .goldrow.miss img{filter:grayscale(1);opacity:.55}
.how.mech{font-size:14px;border-top:1.5px solid rgba(255,255,255,.1);padding-top:6px} .how.mech li{margin:8px 0}
.how.mech img,.how.mech svg{flex:0 0 26px;width:26px;height:26px;object-fit:contain;margin-top:-1px}
/* замок — CSS-формой, не глифом (глиф вне шрифта = кадр 1 с) */
.lock{width:12px;height:10px;border-radius:2px;background:var(--muted);position:relative;margin-top:7px}
.lock:before{content:"";position:absolute;left:2px;top:-7px;width:8px;height:8px;border:2px solid var(--muted);border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box}
.ver{margin-top:8px;font-size:11px;color:var(--muted);opacity:.6;font-weight:800}
.cheat{margin-top:8px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted);border-radius:12px;box-shadow:none}
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.star{width:52px;height:52px;background:#40376c;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:linear-gradient(#fff2a8,#ffcf33 55%,#ff9a3c);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.stars .star:nth-child(2){transform:translateY(-8px)}
@keyframes starIn{from{transform:scale(1.6) rotate(-20deg)}to{transform:scale(1)}}
.stars .star.on:nth-child(2){animation-name:starIn2}
@keyframes starIn2{from{transform:translateY(-8px) scale(1.6) rotate(-20deg)}to{transform:translateY(-8px) scale(1)}}
.how{text-align:left;color:#d9d4ee;margin:0 0 12px;padding-left:0;list-style:none;font-weight:700;font-size:15px;line-height:1.28} .how li{margin:7px 0;display:flex;gap:9px;align-items:flex-start} .how b{color:var(--ink)}
.how .n{flex:0 0 24px;height:24px;border-radius:50%;background:linear-gradient(var(--g-top),var(--g-bot));color:#fff;font-weight:1000;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 0 var(--g-edge)}
.card.help{display:flex;flex-direction:column;padding-bottom:12px} .card.help .hb{overflow-y:auto;min-height:0;flex:1 1 auto;margin:0 -8px;padding:0 8px;overscroll-behavior:contain}
.card.help > button{flex:0 0 auto;margin-top:8px}
#toast{position:absolute;left:50%;top:calc(60px + var(--sat));transform:translateX(-50%);background:rgba(255,248,230,.96);color:var(--ink-dark);padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;white-space:nowrap;z-index:4;font-weight:900;font-size:14px}
#toast.hide{opacity:0}
/* значок «за рекламу» на кнопке: следующая подсказка или запасной провод — за ролик (showRewarded) */
.ad{display:none;position:absolute;right:-7px;top:-9px;width:26px;height:21px;border-radius:7px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.35),0 0 0 2px rgba(10,12,30,.5);pointer-events:none}
.ad:after{content:"";position:absolute;left:10px;top:5.5px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #17142e}
.card button .ad{position:static;display:none;margin-left:auto} .card button.adon .ad{display:inline-block;flex:0 0 26px;position:relative;right:auto;top:auto}
.ib.adon .ad,footer button.adon .ad{display:block}
.ib .ad{right:-9px;top:-7px}
/* карта уровней: 100 кнопок — прокрутка внутри карточки, текущий уровень виден сразу */
.lvwrap{max-height:min(44vh,300px);overflow-y:auto;margin:10px -4px 2px;padding:6px 4px 2px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lvwrap .levels{margin:0}
.card .col{display:flex;flex-direction:column;gap:9px;align-items:stretch;margin-top:4px}
/* рука-подсказка на кнопке (Undo, + wire) на уровне её открытия: DOM поверх кнопок и карточек, ввод не перехватывает */
#coach{position:absolute;left:0;top:0;width:42px;height:46px;margin:-4px 0 0 -20px;pointer-events:none;z-index:7;transform-origin:20px 4px;animation:coachTap 1.1s ease-in-out infinite}
#coach.hide{display:none}
#coach:before{content:"";position:absolute;left:-2px;top:-18px;width:44px;height:44px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);animation:coachRing 1.1s ease-out infinite}
#coach svg{display:block;width:42px;height:46px;overflow:visible}
@keyframes coachTap{0%,100%{transform:translate(5px,12px) rotate(-23deg)}45%{transform:translate(0,2px) rotate(-23deg) scale(.93)}}
#coach.down{animation-name:coachTapDown}   /* кнопки у нижнего края: рука сверху, указывает вниз */
@keyframes coachTapDown{0%,100%{transform:translate(-5px,-12px) rotate(157deg)}45%{transform:translate(0,-2px) rotate(157deg) scale(.93)}}
@keyframes coachRing{0%,40%{transform:scale(.4);opacity:0}50%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion: reduce){ #coach,#coach:before{animation:none} }
.adbar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin:-4px 18px 16px;overflow:hidden} .adbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffe066,#ffb22e);transform-origin:0 50%;animation:adbar linear both}
@keyframes adbar{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
.adbox{margin:8px auto 14px;width:150px;height:96px;border-radius:18px;display:grid;place-items:center;font-size:34px;font-weight:1000;color:var(--ink-dark);background:linear-gradient(#ffe066,#ffb22e)}
@media (prefers-reduced-motion: reduce){ .card,.ib.nudge,footer button.pulse,.ib.nudge:before,footer button.pulse:before,.wl i{animation:none} #toast{transition:none} }
</style>

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function starsFor(moves, par){ return !par || moves <= Math.ceil(par * CFG.STAR3_K) ? 3 : moves <= Math.ceil(par * CFG.STAR2_K) ? 2 : 1; }

// --- солвер: A* по позициям (без птицы — каноническим: порядок одинаковых контейнеров не важен) ---
// Эвристика допустимая: каждая группа (в «колбах» — каждая лампа), лежащая поверх чужого цвета, обязана сдвинуться
// хотя бы раз; донные группы одного цвета в k контейнерах — все, кроме одной, тоже. Флаги ламп её только занижают.
function heuristic(T, R){
  let h = 0; const bottoms = {};
  for (let q = 0; q < T.length; q++){
    const t = T[q]; if (!t.length) continue;
    const c0 = colAt(t, 0);
    let i = 1; while (i < t.length && colAt(t, i) === c0) i++;
    (bottoms[c0] || (bottoms[c0] = [])).push(i);
    if (R.group){ for (let j = i; j < t.length; j++) if (j === i || colAt(t, j) !== colAt(t, j - 1)) h++; }
    else h += t.length - i;
  }
  for (const c in bottoms){
    const b = bottoms[c]; if (b.length < 2) continue;
    if (R.group) h += b.length - 1;
    else { let sum = 0, max = 0; for (const x of b){ sum += x; if (x > max) max = x; } h += sum - max; }
  }
  return h;
}
// Возвращает { path: [{a,b,n}] | null, complete: дошёл ли поиск до конца (false — упёрся в лимит узлов), nodes }.
// weight = 1 — кратчайшее решение; больше — быстрее, но длиннее. goal(p) — своя цель (поиск в ширину), например «собран золотой цвет».
function solveInfo(s, opt){
  const o = opt || {}, R = RULES[s.v], limit = o.nodes || CFG.SOLVE_NODES, w = o.weight || 1, goal = o.goal;
  const hOf = goal ? (p) => (goal(p) ? 0 : Math.max(1, o.h ? o.h(p) : 1)) : (p) => heuristic(p.T, R);   // o.h — своя допустимая эвристика к цели
  const p0 = posOf(s), h0 = hOf(p0);
  if (h0 === 0) return { path: [], complete: true, nodes: 0 };
  const nodes = [{ p: p0, g: 0, from: -1, m: null, k: posKey(s, p0), h: h0 }];
  const best = new Map([[nodes[0].k, 0]]);
  const buckets = [];
  const push = (f, idx) => { (buckets[f] || (buckets[f] = [])).push(idx); };
  push(Math.round(w * h0), 0);
  let fmin = 0, expanded = 0;
  for (;;){
    while (fmin < buckets.length && (!buckets[fmin] || !buckets[fmin].length)) fmin++;
    if (fmin >= buckets.length) return { path: null, complete: true, nodes: expanded };
    const idx = buckets[fmin].pop(), nd = nodes[idx];
    if (best.get(nd.k) < nd.g) continue;
    if (nd.h === 0){
      const path = []; let at = idx;
      while (nodes[at].from >= 0){ path.push(nodes[at].m); at = nodes[at].from; }
      return { path: path.reverse(), complete: true, nodes: expanded };
    }
    if (++expanded > limit) return { path: null, complete: false, nodes: expanded };
    const ms = movesOf(s, nd.p);
    for (let i = 0; i < ms.length; i++){
      const r = stepPos(s, nd.p, ms[i]), p2 = { T: r.T, bird: r.bird, ice: r.ice }, k = posKey(s, p2), g2 = nd.g + 1, b = best.get(k);
      if (b !== undefined && b <= g2) continue;
      best.set(k, g2);
      const h = hOf(p2);
      nodes.push({ p: p2, g: g2, from: idx, m: ms[i], k, h });
      const f = g2 + Math.round(w * h);
      push(f, nodes.length - 1);
      if (f < fmin) fmin = f;
    }
  }
}
function solve(s, opt){ return solveInfo(s, opt).path; }
// Подсказка: { move, dead } — следующий ход быстрого солвера; dead = отсюда точно не собрать.
function hintMove(s){
  const r = solveInfo(s, { nodes: CFG.HINT_NODES, weight: CFG.HINT_WEIGHT });
  if (r.path && r.path.length) return { move: r.path[0], dead: false };
  if (!r.path && !r.complete){ const ms = legalMoves(s); return { move: ms.find(m => s.tubes[m.b].length) || ms[0] || null, dead: false }; }   // не досчитал — хотя бы слияние
  return { move: null, dead: !r.path };
}

// --- боты для симулятора (PROTO-BASE §6): случайный и новичок (жадный без отмены и без счёта вперёд) ---
// Про механики боты не знают: недоступные ходы им просто не предлагаются. Возвращают и счётчики событий механик.
function botRun(s0, seed, pick, noRepeat){
  const rnd = mulberry32(seed); let s = s0, prev = null, firstDone = 0, merges = 0, wild = 0, reveals = 0;
  const seen = new Set([posKey(s, posOf(s))]);
  while (!isWin(s) && s.moves < CFG.BOT_MOVE_CAP){
    let ms = legalMoves(s).filter(m => !(prev && m.a === prev.b && m.b === prev.a));
    if (noRepeat) ms = ms.filter(m => { const r = stepPos(s, posOf(s), m); return !seen.has(posKey(s, r)); });
    if (!ms.length) break;
    const m = pick(s, ms, rnd);
    s = applyMove(s, m); seen.add(posKey(s, posOf(s))); prev = m;
    if (s.last.merge) merges++; if (s.last.wild) wild++; if (s.last.reveal) reveals++;
    if (!firstDone && s.done.length) firstDone = s.moves;
  }
  return { win: isWin(s), moves: s.moves, firstDone, merges, wild, reveals, gold: !!s.gold && s.gold.st === 1 };
}
function pickRandom(s, ms, rnd){ return ms[Math.floor(rnd() * ms.length)]; }
// Новичок видит только открытые лампы: собрать цвет > прицепить к своему цвету > сесть через перламутровую > занять пустой
// контейнер (лучше, если откроется нужная лампа).
function pickNovice(s, ms, rnd){
  const R = RULES[s.v], T = s.tubes; let best = null, bestSc = -1;
  for (const m of ms){
    const A = T[m.a], B = T[m.b], c = topLamp(A) & COLOR, run = topRun(A); let sc;
    const below = A.length > m.n ? lampAt(A, A.length - 1 - m.n) : -1;
    const useful = below >= 0 && !(below & HID) && T.some((t, i) => i !== m.a && i !== m.b && t.length && (topLamp(t) & COLOR) === (below & COLOR) && s.caps[i] > t.length && i !== s.bird && i !== s.ice);
    if (isComplete(B + A.slice(A.length - m.n), perOf(s, c))) sc = 100;
    else if (B.length && (topLamp(B) & COLOR) === c) sc = (!R.group || m.n === run ? 50 : 30) + Math.max(1, topRun(B)) * 4 + (m.n === A.length ? 6 : 0);
    else if (B.length) sc = 16 + (useful ? 8 : 0);
    else sc = 10 + (m.n > 1 ? 3 : 0) + (useful ? 8 : 0);
    sc += rnd() * 6;
    if (sc > bestSc){ bestSc = sc; best = m; }
  }
  return best;
}
function randomRun(levelIndex, variant, seed){ return botRun(createState(levelIndex, variant), seed, pickRandom, false); }
function noviceRun(levelIndex, variant, seed){ return botRun(createState(levelIndex, variant), seed, pickNovice, true); }
// --- бесконечная линейка: после последнего уровня — круг с уровня loopFrom (номер для игрока растёт дальше: 101, 102…) ---
// loopIndex(n, total, loopFrom): уровень по порядку n (с нуля) → индекс в LEVELS. Круг — уровни loopFrom…total (с единицы).
function loopIndex(n, total, loopFrom){
  n = Math.max(0, n | 0); if (n < total) return n;
  const a = Math.max(1, Math.min(total, loopFrom | 0)) - 1, len = total - a;
  return a + (n - total) % len;
}
// recolor(s, seed): та же раздача в других цветах — перестановка цветов 0…colors−1 (перламутровая, флаги, патрон и золотая — следом).
// Решение и par не меняются: правила зависят только от равенства цветов. Нужна, чтобы круг после 100-го не повторял картинку.
function recolor(s, seed){
  const r = mulberry32(seed), perm = []; for (let c = 0; c < s.colors; c++) perm.push(c);
  for (let i = perm.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const x = perm[i]; perm[i] = perm[j]; perm[j] = x; }
  const map = (c) => c >= 0 && c < s.colors ? perm[c] : c;
  const tubes = s.tubes.map(t => { let o = ''; for (let i = 0; i < t.length; i++){ const v = lampAt(t, i); o += lampCh((v & ~COLOR) | map(v & COLOR)); } return o; });
  return Object.assign({}, s, { tubes, sock: s.sock.map(map), gold: s.gold ? Object.assign({}, s.gold, { col: map(s.gold.col) }) : null });
}

function readRemoteConfig(){
  const sdk = window.pfSdk; if (!sdk || !sdk.config || typeof sdk.config.get !== 'function') return;
  const val = (x) => { if (typeof x !== 'string') return x; try { return JSON.parse(x); } catch (e) { return x; } };
  const get = (k, d) => { try { const x = val(sdk.config.get(k, d)); return x === undefined || x === null || x === '' ? d : x; } catch (e) { return d; } };
  const int = (k, d, lo, hi) => { const x = Math.round(Number(get(k, d))); return isFinite(x) ? Math.max(lo, Math.min(hi, x)) : d; };
  const num = (k, d, lo, hi) => { const x = Number(get(k, d)); return isFinite(x) ? Math.max(lo, Math.min(hi, x)) : d; };
  const bool = (k, d) => { const x = get(k, d); return x === false || x === 'false' || x === 0 ? false : x === true || x === 'true' || x === 1 ? true : d; };
  RC.LOOP_FROM = int('loop_from_level', RC.LOOP_FROM, 1, LEVELS.a.length);
  RC.INTER_FROM = int('inter_start_level', RC.INTER_FROM, 1, 100000);
  RC.INTER_ON_RETRY = bool('inter_on_retry', RC.INTER_ON_RETRY);
  RC.HINTS_FREE = int('hints_free', RC.HINTS_FREE, 0, 1000);
  RC.UNDO_FROM = int('undo_unlock_level', RC.UNDO_FROM, 1, 100000);
  RC.WIRE_FROM = int('wire_unlock_level', RC.WIRE_FROM, 1, 100000);
  CFG.NUDGE_IDLE_MS = int('idle_hint_ms', CFG.NUDGE_IDLE_MS, 2000, 600000);
  CFG.STAR3_K = num('star3_k', CFG.STAR3_K, 1, 5);
  CFG.STAR2_K = Math.max(CFG.STAR3_K, num('star2_k', CFG.STAR2_K, 1, 10));
  log('event', 'config', JSON.stringify({ RC, idle_hint_ms: CFG.NUDGE_IDLE_MS, star3_k: CFG.STAR3_K, star2_k: CFG.STAR2_K }));
}

// --- звук: WebAudio-синтез без файлов, ленивый старт по первому жесту (§8) ---
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24, 26, 28];   // пентатоника для лампочек
const Sound = {
  ac: null, out: null, wet: null, noise: null,
  init(){
    if (this.ac){ if (this.ac.state === 'suspended' && !G.paused) this.ac.resume(); return; }
    try {
      const ac = this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
      this.out = ac.createGain(); this.out.gain.value = 0.6; this.out.connect(comp);
      const r = mulberry32(99), n = Math.floor(ac.sampleRate * 0.6), nb = ac.createBuffer(1, n, ac.sampleRate), d = nb.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = r() * 2 - 1;
      this.noise = nb;
      // реверберация: импульс — затухающий шум 1,6 с (мягкое эхо стеклянных колокольчиков)
      const L = Math.floor(ac.sampleRate * 1.6), ir = ac.createBuffer(2, L, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++){ const b = ir.getChannelData(ch); for (let i = 0; i < L; i++) b[i] = (r() * 2 - 1) * Math.pow(1 - i / L, 2.6); }
      const conv = ac.createConvolver(); conv.buffer = ir;
      this.wet = ac.createGain(); this.wet.gain.value = 0.3; this.wet.connect(conv); conv.connect(this.out);
    } catch (e) { this.ac = null; }
  },
  ok(){ return this.ac && !G.save.muted && !G.paused; },
  suspend(){ try { if (this.ac && this.ac.state === 'running') this.ac.suspend(); } catch (e) {} },          // пауза и фон: звук молчит целиком
  wake(){ try { if (this.ac && !G.paused && this.ac.state === 'suspended') this.ac.resume(); } catch (e) {} },
  env(g, t, vol, atk, ms){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000); },
  tone(freq, ms, type, vol, at, glideTo, wet){
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + ms / 1000);
    this.env(g, t, vol || 0.2, 0.006, ms);
    o.connect(g); g.connect(this.out); if (wet) g.connect(this.wet);
    o.start(t); o.stop(t + ms / 1000 + 0.03);
  },
  bell(freq, at, vol){                 // стеклянный колокольчик: основной тон + негармонические обертоны, с эхом
    this.tone(freq, 900, 'sine', vol, at, 0, true);
    this.tone(freq * 2.76, 380, 'sine', vol * 0.35, at, 0, true);
    this.tone(freq * 5.4, 160, 'sine', vol * 0.12, at, 0, true);
  },
  hiss(ms, filt, freq, vol, at, q){
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (at || 0), src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noise; f.type = filt; f.frequency.value = freq; if (q) f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    src.connect(f).connect(g).connect(this.out); src.start(t, (at || 0) % 0.3); src.stop(t + ms / 1000 + 0.02);
  },
  note(step){ return 523.25 * Math.pow(2, PENTA[Math.max(0, Math.min(Math.round(step) || 0, PENTA.length - 1))] / 12); },
  ui(){ this.tone(640, 50, 'triangle', 0.06); log('sound', 'ui'); },
  aim(){ this.tone(1180, 26, 'sine', 0.035); },          // перетаскивание: лампа навелась на провод
  pick(n){ const f = 392 * Math.pow(2, PENTA[Math.max(0, Math.min((n || 1) - 1, 4))] / 12); this.hiss(28, 'bandpass', 2600, 0.16, 0, 3); this.tone(f, 70, 'triangle', 0.07, 0, f * 1.35); log('sound', 'pick'); },   // чем больше ламп снялось — тем выше
  fly(n){ this.hiss(150 + 40 * Math.min(n, 4), 'bandpass', 1300, 0.045, 0, 0.7); this.tone(300, 150, 'sine', 0.022, 0, 640); log('sound', 'fly'); },   // взлёт группы: мягкий «фух»
  land(step){ this.hiss(20, 'bandpass', 2200, 0.3, 0, 4); this.tone(150, 80, 'sine', 0.16, 0, 80); this.bell(this.note(step), 0.01, 0.055); log('sound', 'land'); },
  kiss(size){                          // «поцелуй»: парный аккорд совпавших ламп (чем длиннее группа — тем выше), искра тока, блёстки
    const b = 1 + size * 2;
    this.bell(this.note(b), 0.02, 0.1); this.bell(this.note(b + 2), 0.02, 0.075);
    this.tone(1800, 110, 'sawtooth', 0.02, 0.01, 5000);
    this.hiss(220, 'highpass', 6000, 0.05, 0.04);
    log('sound', 'kiss', 'size=' + size);
  },
  waveNote(j){ this.bell(this.note(3 + j), 0, 0.09); },
  complete(k){ const up = PENTA[Math.max(0, Math.min(k || 0, 5))]; [0, 4, 7, 12].forEach(s => this.tone(261.63 * Math.pow(2, (s + up) / 12), 1300, 'triangle', 0.05, 0, 0, true));   // каждая следующая гирлянда уровня — аккорд выше
    this.hiss(520, 'bandpass', 3200, 0.1, 0, 1.5); log('sound', 'complete'); },
  leave(){ this.hiss(420, 'highpass', 2500, 0.08); this.tone(480, 380, 'sine', 0.05, 0, 1500); log('sound', 'leave'); },
  ting(k){ this.bell(this.note(7 + (k % 5)), 0, 0.04); },
  cap(){ this.tone(220, 120, 'sine', 0.2, 0, 110); this.hiss(40, 'bandpass', 1500, 0.3, 0, 2); this.bell(this.note(9), 0.05, 0.07); log('sound', 'cap'); },
  bad(){ this.tone(196, 90, 'sine', 0.12, 0, 165); this.tone(156, 130, 'sine', 0.1, 0.085, 131); this.hiss(40, 'lowpass', 700, 0.06); log('sound', 'bad'); },   // мягкое «не-а»: два глухих тука вниз, не зуммер
  full(){ this.tone(131, 110, 'sine', 0.14, 0, 98); this.hiss(50, 'lowpass', 500, 0.09); log('sound', 'full'); },   // нет места: один глухой стук
  undo(){ this.tone(560, 130, 'triangle', 0.09, 0, 300); log('sound', 'undo'); },
  spare(){ this.tone(300, 240, 'triangle', 0.09, 0, 900); this.bell(this.note(6), 0.16, 0.06); log('sound', 'spare'); },
  stuck(){ this.bell(392, 0, 0.07); this.bell(330, 0.22, 0.07); log('sound', 'stuck'); },
  // --- механики ---
  glint(){ this.tone(3300, 120, 'sine', 0.035, 0, 0, true); this.tone(4400, 180, 'sine', 0.028, 0.07, 0, true); log('sound', 'glint'); },   // блик по льду: новая механика
  iceTap(){ this.tone(2400, 70, 'sine', 0.06, 0, 1700); this.tone(3300, 110, 'sine', 0.04, 0.03, 0, true); this.hiss(50, 'highpass', 5000, 0.12); log('sound', 'ice.tap'); },   // стук по льду: не снимается
  crack(at){ this.hiss(70, 'highpass', 3400, 0.2, at || 0, 2); this.tone(1900, 50, 'square', 0.03, at || 0, 700); },
  thaw(){ [0, 0.09, 0.21, 0.34].forEach(a => this.crack(a)); this.tone(220, 900, 'sine', 0.07, 0.08, 440, true); [7, 9, 12].forEach((s, i) => this.bell(this.note(s), 0.26 + i * 0.1, 0.05)); log('sound', 'thaw'); },
  reveal(col){ this.hiss(18, 'bandpass', 1800, 0.3, 0, 5); this.tone(900, 40, 'square', 0.04); this.bell(this.note(4 + col), 0.03, 0.09); log('sound', 'reveal'); },   // щелчок: тёмная лампа загорелась
  pearl(){ [5, 8, 10].forEach((s, i) => this.bell(this.note(s), i * 0.05, 0.06)); this.hiss(260, 'highpass', 7000, 0.04); log('sound', 'pearl'); },
  chirp(){ this.tone(2600, 70, 'sine', 0.09, 0, 3600); this.tone(3200, 60, 'sine', 0.08, 0.09, 2500); this.tone(2900, 90, 'sine', 0.07, 0.17, 3900); log('sound', 'chirp'); },
  flap(){ [0, 0.11, 0.22, 0.33, 0.44].forEach(a => this.hiss(60, 'lowpass', 900, 0.14, a)); log('sound', 'flap'); },
  tick(left){ const hot = left <= CFG.GOLD_WARN; this.tone(hot ? 1500 : 1100, 35, 'square', 0.035); this.tone(hot ? 2250 : 1650, 60, 'sine', 0.04, 0.02); },
  gold(){ [0, 4, 7, 12, 16, 19].forEach((s, i) => this.bell(659.25 * Math.pow(2, s / 12), i * 0.07, 0.09)); [0, 7, 12].forEach(s => this.tone(329.63 * Math.pow(2, s / 12), 1200, 'triangle', 0.05, 0.1, 0, true)); this.hiss(500, 'highpass', 6500, 0.07, 0.05); log('sound', 'gold'); },
  goldLost(){ this.tone(700, 380, 'triangle', 0.08, 0, 160); this.hiss(300, 'lowpass', 1200, 0.1); log('sound', 'gold.lost'); },
  sockNo(){ this.tone(240, 120, 'triangle', 0.14, 0, 180); this.bell(this.note(2), 0.02, 0.04); log('sound', 'sock.no'); },
  win(){ [0, 2, 4, 7, 9, 12].forEach((k, i) => this.bell(this.note(k + 1), i * 0.11, 0.09)); [0, 4, 7, 12].forEach(s => this.tone(261.63 * Math.pow(2, s / 12), 1800, 'triangle', 0.045, 0.6, 0, true)); log('sound', 'win'); },
};
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// winLights: гирлянда цветов, собранных на уровне (порядок сбора), — главный «праздник» карточки вместо звёзд
function winLights(){

  if (!cols.length) for (let c = 0; c < (G.s ? G.s.colors : 5); c++) cols.push(c);

$('card').addEventListener('click', (e) => {
  const b = e.target && e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
  const act = b.dataset.act;
  if (G.screen === 'ad'){ if (act === 'ad-close'){ Sound.init(); Sound.ui(); adClose(); } return; }
  Sound.init(); Sound.ui(); log('input', 'button', act);
  if (act === 'play'){ quitMark('levels'); startLevel(curLevel()); }
  else if (act === 'retry') interThen('retry', () => { log('event', 'level.restart', 'level=' + levelNo(G.s) + ' from=stuck'); startLevel(G.s ? G.s.no : 0); });
  else if (act === 'next'){ const n = (G.s ? G.s.no : -1) + 1; interThen('next', () => startLevel(n)); }
  else if (act === 'help'){ G.helpBack = G.screen === 'pause' ? 'pause' : 'menu'; goto('help'); }
  else if (act === 'back') goto(G.helpBack === 'pause' && G.s ? 'pause' : G.s ? 'game' : 'menu');
  else if (act === 'privacy'){ const f = sdkSettings(); if (f) f(); }
  else if (act === 'resume') goto('game');
  else if (act === 'restart'){ log('event', 'level.restart', 'level=' + levelNo(G.s) + ' moves=' + (G.s ? G.s.moves : 0) + ' from=pause'); startLevel(G.s ? G.s.no : curLevel()); }
  else if (act === 'lvl'){ const n = +b.dataset.li; if (isOpen(n)){ if (!G.s || G.s.no !== n) quitMark('levels'); startLevel(n); } else toast('Finish level ' + (G.save.level[G.v] + 1) + ' first'); }
  else if (act === 'undo'){ goto('game'); undo(); }
  else if (act === 'spare'){ goto('game'); useSpare(); }
  else if (DEV && devAct(act, b)){}
  else if (DEV && act === 'menu') goto('menu');
  else goto(G.s ? 'game' : 'menu');
});

// --- реклама: обёртка Proto-vibe заменяет тела showRewarded и showInterstitial настоящим SayKit; здесь — заглушка «AD» ---
// showRewarded(onReward): за награду; onReward — только если досмотрели. Места (adPlace): hint — подсказка после бесплатных,
//   spare — запасной провод после бесплатных (кнопка внизу и карточка «No moves left»).
// showInterstitial(onDone): межуровневая; её зовёт сама игра (interThen) на «Next» и на «Restart» из «No moves left», onDone — когда закрылась.
let adPlace = '';
function showRewarded(onReward){ adStub(adPlace || 'rewarded', onReward); }
function showInterstitial(onDone){ adStub('interstitial', onDone); }
function interThen(kind, go){
  const n = G.s ? levelNo(G.s) : 0;
  if (G.v !== 'a' || n < RC.INTER_FROM || (kind === 'retry' && !RC.INTER_ON_RETRY)) return go();
  log('event', 'ad.inter', kind + ' level=' + n); showInterstitial(go);
}
// Заглушка: экран «AD» на RC.AD_MS (игра на паузе, звук заглушён), потом колбэк.
// «No thanks» на ролике за награду — отказ: награды нет, игрок возвращается туда, откуда пришёл (как закрытый ролик в SayKit).
function adStub(what, then){
  if (G.busyAd) return;
  const back = G.screen, ad = G.busyAd = { what, back, timer: 0 };
  goto('ad', what); setPaused('ad', true); log('event', 'ad.show', what);
  ad.timer = setTimeout(() => { if (G.busyAd !== ad) return; G.busyAd = null; setPaused('ad', false); log('event', 'ad.done', what);
    if (G.screen === 'ad') goto(back === 'stuck' ? 'game' : back); then(); }, RC.AD_MS);
}
function adClose(){
  const ad = G.busyAd; if (!ad) return; clearTimeout(ad.timer); G.busyAd = null; setPaused('ad', false);
  log('event', 'ad.cancel', ad.what); goto(ad.back);
}
const hintNeedsAd = () => G.v === 'a' && G.save.hints >= RC.HINTS_FREE;
// Доступ к Undo и + wire по номеру уровня: 'locked' — кнопки нет, 'free' — уровень открытия (бесплатно, урок), 'ad' — за ролик.
// В «Колбах» (только DEV) — как было: бесплатно.
function gate(from, s){ s = s || G.s; if (!s || s.v !== 'a') return 'free'; const n = levelNo(s); return n < from ? 'locked' : n === from ? 'free' : 'ad'; }

let toastUntil = 0;

// --- раскладка: всё в виртуальных юнитах при ширине VW (§2) ---
const cv = $('cv'), ctx = cv.getContext('2d');
const VW = CFG.VW;
let scale = 1, W = VW, H = 640, DPR = 1;
const SAFE = { top: 0, bottom: 0 };                  // безопасные зоны экрана (чёлка, полоска жестов) в виртуальных юнитах — поле и итоговая гирлянда отступают на них
const topY = () => CFG.TOP_Y + SAFE.top;             // высота подвеса итоговой гирлянды
// Запасной контейнер на первых уровнях спрятан: на экране только то, что нужно для урока.
const spareOpen = (s) => s.v !== 'a' ? s.no >= CFG.SPARE_FROM_LEVEL - 1 : levelNo(s) >= RC.WIRE_FROM;
// layout(): места контейнеров. Место под запасной контейнер зарезервировано заранее (призрак) — поле не прыгает.
function layout(){
  const s = G.s; if (!s) return;
  const n = s.caps.length, ghost = s.spare < CFG.SPARE_PER_LEVEL && spareOpen(s) ? 1 : 0, N = n + ghost;
  const capOf = (i) => i < n ? s.caps[i] : s.per;
  GEO.cont = []; GEO.ghost = ghost ? n : -1;
  if (s.v === 'a'){
    // провода растут от левой и правой стены в шахматном порядке, как ветки
    // Масштаб k: мало проводов — лампы крупнее. Ограничения: провод не длиннее половины ширины (шаг ламп упирается в стену),
    // лампа не шире A_FILL шага, ряд не выше свободной высоты / числа рядов; k от 1 до A_K_MAX.
    const rows = Math.ceil(N / 2), top = CFG.A_TOP + SAFE.top, bottom = H - CFG.A_BOTTOM - SAFE.bottom;
    let maxCap = 0; for (let i = 0; i < N; i++) maxCap = Math.max(maxCap, capOf(i));
    const room = W / 2 - CFG.A_WALL - 12, baseStep = (cap) => cap >= 5 ? CFG.A_STEP5 : CFG.A_STEP;
    const stepAt = (cap, k) => Math.max(baseStep(cap), Math.min(baseStep(cap) * k, room / cap));
    const rowFree = (bottom - top) / (rows + 0.5);

    }
  }
}
const bulbH = () => GEO.r * CFG.BULB_H_K;
const topScale = () => CFG.TOP_SCALE / GEO.k;                     // итоговая гирлянда сверху — того же размера при любом k
// Пружинка: провод качается после посадки, снятия ламп и ухода гирлянды — затухающая синусоида поверх провиса (лампы висят на нём и качаются вместе).
function sagOf(i){ const k = V.kick[i]; if (!k) return CFG.A_SAG; const tau = (now() - k.t0) / dur(CFG.KICK_MS); if (tau >= 1){ delete V.kick[i]; return CFG.A_SAG; } return CFG.A_SAG + k.amp * Math.exp(-4.5 * tau) * Math.sin(tau * 17); }

function slotPos(ci, si){

  if (G.s.v === 'a'){ const d = CFG.A_WALL + (si + 0.5) * c.step; return { x: c.x0 + c.dir * d, y: wireY(c, d) }; }

// mouthPos: точка подвеса лампы, висящей над горлышком колбы (вариант b)

function wireEnd(i){ const g = GEO.cont[i]; return g && g.dir ? { x: g.x0 + g.dir * (g.len - 7), y: g.y + 1 } : { x: W / 2, y: H / 2 }; }

  if (!G.s) return -1;

  for (const c of GEO.cont){
    let d;
    if (G.s.v === 'a'){
      if ((c.side === 0) !== (p.x < W / 2)) continue;
      d = Math.abs(p.y - (c.y + 14 * GEO.k)); if (d > GEO.rowH * 0.5) continue;
    } else {
      d = Math.abs(p.x - c.x); if (d > GEO.tw / 2 + CFG.HIT_PAD + 3) continue;

// --- визуальная модель ламп ---
let lampSeq = 0;
// v — значение лампы из ядра (цвет + флаги). ice/hid/gold — что лампа показывает сейчас; iceT/revT/goldT — моменты, когда
// иней начал таять, тёмная открылась, золотой патрон погас (переходы — функции абсолютного времени).
function mkLamp(v, ci, si){
  return { id: lampSeq++, col: v & COLOR, ice: !!(v & ICE), hid: !!(v & HID), gold: !!(v & GOLD), iceT: -1e9, revT: -1e9, goldT: -1e9,
    ci, si, top: -1, landed: true, fly: null, flyId: 0, lift: tw(0), lit: tw(0), sc: tw(1),
    landT: -1e9, landDir: 1, kissT: -1e9, kissDir: 0, flashT: -1e9, flashK: 0, popT: -1e9, popK: 0, noT: -1e9, grp: null, px: 0, py: 0, dragX: null, dragY: null, dragFrom: null, landCb: null };   // landCb — что сделать, когда полёт закончится (см. lampPose)   // popT/popK — толчок масштаба, noT — качает «нет», grp — гирлянда, в которой лампа доигрывает сбор
}
// яркость лампы по длине её группы: одиночная не горит, пара загорается, собранный цвет — в полную силу
function litLevel(L, per){ return L < 2 ? CFG.LIT_SINGLE : CFG.LIT_PAIR + (1 - CFG.LIT_PAIR) * (L - 2) / Math.max(1, per - 2); }
function relight(ci, t, instant){ relightArr(V.cont[ci], t, instant); }
// Свет провода (решение Андрея 13.11, плейтест): горит провод, на котором ВСЕ лампы одного цвета (от двух ламп);
// если на проводе есть чужой цвет или тёмная лампа — не горит ничего. Яркость растёт с числом ламп до собранного цвета.
// (Раньше: горела любая пара соседок → закрытые пары в середине сбивали; потом «ток от розетки» — цепочка от основания.)
function relightArr(arr, t, instant){
  if (!arr) return;
  let n = 0; while (n < arr.length && arr[n].landed) n++;          // летящие лампы — в хвосте, пока не считаются
  const pure = n >= 2 && arr.slice(0, n).every(l => !l.hid && l.col === arr[0].col);
  const v = pure ? litLevel(n, perOf(G.s, arr[0].col)) : CFG.LIT_SINGLE;
  for (let q = 0; q < arr.length; q++){
    const want = q < n ? v : CFG.LIT_SINGLE;
    if (instant) arr[q].lit = tw(want); else if (arr[q].lit.b !== want) twTo(arr[q].lit, want, t, CFG.LIT_MS);
  }
}
// syncVisual: собрать визуальную модель заново из состояния ядра (старт уровня, отмена)
function syncVisual(){
  const s = G.s, t = now();
  V.cont = s.tubes.map((str, i) => Array.from(str, (ch, j) => { const l = mkLamp(lampAt(str, j), i, j); if (i === s.ice) l.ice = true; return l; }));   // на обледеневшем проводе в инее все лампы
  V.top = []; V.capT = {}; V.goldT = {}; V.bornT = {}; V.gone = []; V.pending = 0; V.kick = {}; V.curT = {}; V.birdDue = 0; G.no = null; G.inputT = t;
  V.bird = s.bird >= 0 ? { at: s.bird, from: -1, t0: 0, d: 1 } : null; V.iceWire = s.ice; V.iceWireT = {}; G.spot = null; G.rays = []; G.handCache = null;
  if (RULES[s.v].leave) s.done.forEach((col) => { const n = perOf(s, col); for (let j = 0; j < n; j++){ const l = mkLamp(col, -1, 0); l.top = V.top.length; l.lit = tw(1); l.sc = tw(topScale()); V.top.push(l); } });
  else s.tubes.forEach((str, i) => { if (isComplete(str, s.per)) V.capT[i] = -1e9; });
  layout();
  for (let i = 0; i < V.cont.length; i++) relight(i, t, true);

function selLamps(){ if (G.sel < 0 || !V.cont[G.sel]) return []; const arr = V.cont[G.sel]; return arr.slice(Math.max(0, arr.length - G.selN)); }
// lampPose: где лампа сейчас — { x, y, ang, sc }. Всё — функции абсолютного времени.
function lampPose(l, t){
  const base = l.top >= 0 ? topPos(l.top) : slotPos(l.ci, l.si), isA = G.s.v === 'a';
  let x = base.x, y = base.y, ang = 0, sc = twVal(l.sc, t);
  const lift = twVal(l.lift, t), liftY = lift > 0.001 && l.top < 0 ? (isA ? CFG.A_LIFT * GEO.k : base.y - mouthPos(l.ci).y) * lift : 0;
  const dg = G.drag;
  if (dg && l.ci === G.sel && l.top < 0 && !l.grp && l.si >= V.cont[l.ci].length - G.selN){     // перетаскивание: группа веером над пальцем
    // Подхват за DRAG_GRAB_MS (от места, где лампу застало касание, — хоть в полёте), дальше лампа идёт за пальцем жёстко, в тот же кадр:
    // «догоняние» читается как вязкость, а цель выбирается по лампе — она должна быть там, где её видит игрок.
    const q = l.si - (V.cont[l.ci].length - G.selN), n = G.selN, k = ease((t - dg.t0) / dur(CFG.DRAG_GRAB_MS)), f = l.dragFrom || { x, y: y - liftY };
    const tx = dg.x + (q - (n - 1) / 2) * GEO.r * 2.1, ty = dg.y - CFG.DRAG_GAP - bulbH() * (1 - CFG.BULB_HOOK_K);
    x = f.x + (tx - f.x) * k; y = f.y + (ty - f.y) * k;
    if (isA) ang = Math.max(-0.4, Math.min(0.4, dg.vx * 0.45)) * Math.exp(-(t - dg.lt) / 140);   // лампа отстаёт «хвостом» от движения пальца
    l.dragX = l.px = x; l.dragY = l.py = y;

  }
  if (l.dragX !== null) l.dragX = l.dragY = null;
  if (l.fly){
    let seg = null;
    for (const sg of l.fly) if (t < sg.t0 + sg.d){ seg = sg; break; }
    if (!seg){ l.fly = null; const cb = l.landCb; if (cb){ l.landCb = null; cb(l); } }   // посадка — по состоянию полёта в кадре, а не по таймеру: полёт можно ускорить или перебить
    else {
      // Цель полёта живая: место лампы считается каждый кадр (провод пружинит, раскладка меняется, лампу выбрали в полёте — она садится уже приподнятой).
      const e = seg.ease((t - seg.t0) / seg.d), m = seg.to === 2 || seg.from === 2 ? mouthPos(l.ci) : null;
      const x0 = seg.from === 2 ? m.x : seg.x0, y0 = seg.from === 2 ? m.y : seg.y0, x1 = seg.to === 2 ? m.x : base.x, y1 = seg.to === 2 ? m.y : base.y - liftY;
      x = x0 + (x1 - x0) * e; y = y0 + (y1 - y0) * e - seg.arc * 4 * e * (1 - e);
      if (isA) ang = (x1 - x0) / 400 * Math.sin(e * Math.PI) * 0.9;     // в полёте лампа отстаёт «хвостом»
      l.px = x; l.py = y;

// startFly: лампа летит из p0 на своё место (l.ci/l.si или l.top). kind: '' — перелёт на провод (в колбу — через горлышко),

function startFly(l, p0, delayMs, kind, ms){
  const t0 = now() + dur(delayMs || 0), to = l.top >= 0 ? topPos(l.top) : slotPos(l.ci, l.si), d = dur(ms || CFG.FLY_MS);

    const d1 = d * 0.62, d2 = d * 0.38;                          // дуга до горлышка, потом падение в колбу
    l.fly = [{ x0: p0.x, y0: p0.y, t0, d: d1, arc: CFG.FLY_ARC * 0.55, ease: easeIO, to: 2 }, { from: 2, t0: t0 + d1, d: d2, arc: 0, ease: easeIn, to: 1 }];

// hurry: лампу тронули в полёте (выбрали её провод) — она не доигрывает дугу, а за FLY_HURRY_MS приходит на место, уже приподнятая.

function hurry(l){

  if (!l.fly) return;
  l.fly = [{ x0: p.x, y0: p.y, t0: t, d: Math.max(1, Math.min(left, dur(CFG.FLY_HURRY_MS))), arc: 0, ease: ease, to: 1 }];

// --- частицы и кольца: положение считается от t0 аналитически (абсолютное время, §4) ---
function burst(x, y, cols, n, speed, opt){

    const a = o.up ? -Math.PI / 2 + (r() - 0.5) * (o.spread || 2.2) : r() * Math.PI * 2, v = speed * (0.35 + r() * 0.65);

// --- уровень и ходы ---

const canInput = () => G.s && G.screen === 'game' && !G.ending && now() >= G.lockUntil;
// liftWhy: почему с провода нельзя снять лампы — 'bird' | 'ice' | 'frost' | '' (можно или провод пуст)
function liftWhy(ci){ const s = G.s, t = s.tubes[ci]; if (!t || !t.length) return ''; return s.bird === ci ? 'bird' : s.ice === ci ? 'ice' : (topLamp(t) & ICE) ? 'frost' : ''; }

function noteInput(){ G.idleT = G.inputT = now(); if (G.hint && G.hint.auto) G.hint = null; }
function select(ci, quiet){

// bad: отказ — отклик по причине: птица чирикает и показывает, куда полетит; лёд звенит; патрон вспыхивает силуэтами (провод трясётся);
// чужой цвет или нет места — мягко, без тряски: видно, какие две лампы не сошлись (noFx). from — провод, с которого несли лампы.
function bad(ci, why, from){

  if (soft) noFx(from === undefined ? G.sel : from, ci, why); else G.bad = { ci, t0: now() };
  buzz(soft ? 12 : 30); log('fx.start', 'bad', 'c=' + ci + (why ? ' why=' + why : ''));
  const bk = why === 'frost' ? 'frost' : why === 'ice' ? 'iceWire' : why === 'bird' ? 'bird' : '';
  if (bk && G.lesson && G.lesson.keys.includes(bk) && !learned(bk)){ G.lesson.bump = bk; G.idleT = now(); log('event', 'lesson.bump', bk); }   // упёрся в непрожитую механику — рука покажет выход, если он в одном ходе

// noFx: мягкий отказ. Чужой цвет — поднятая лампа и крайняя на проводе качают «нет», вокруг каждой кольцо её цвета (drawNo): видно, что не сошлось.

function noFx(a, b, why){

// settle: игрок тронул провод, на котором эффект ещё не доигран (ядро уже впереди: иней растаял, птица улетела) — доиграть сразу,

function settle(ci){

  const str = s.tubes[ci] || '';
  V.cont[ci].forEach((l, j) => { if (l.ice && s.ice !== ci && j < str.length && !(lampAt(str, j) & ICE)) meltLamp(l); });

  if (G.sel < 0){ if (liftable(ci)) select(ci); else if (liftWhy(ci)) bad(ci, liftWhy(ci)); return true; }
  if (G.sel === ci){ select(-1); return true; }

  bad(ci, whyNot(G.s, posOf(G.s), G.sel, ci), G.sel);

// Лампы: сетка с разбросом, глубина z (дальние мельче и тусклее); у каждой свой цикл «загорелась — держит — гаснет — темно».

// lampLight(L, u): яркость лампы 0…1 и момент последнего загорания (для щелчка-вспышки) — чистая функция времени от старта
function lampLight(L, u){

  const idle = G.screen === 'game' && canInput() && !G.hint && t - G.inputT > dur(CFG.NUDGE_IDLE_MS);
  if (idle !== G.nudge){ G.nudge = idle; $('btn-hint').classList.toggle('nudge', idle); }
  if (G.shake){ const k = (t - G.shake.t0) / dur(CFG.SHAKE_MS); if (k >= 1 || REDUCED) G.shake = null; else { const a = G.shake.amp * (1 - k) * (1 - k); ctx.translate(Math.sin(k * 33) * a, Math.cos(k * 25) * a * 0.7); } }
  if (!G.hint && !G.drag && canInput() && t - G.idleT > dur(G.sel >= 0 || (G.lesson && G.lesson.bump) ? CFG.HAND_SEL_MS : CFG.HINT_IDLE_MS)) autoHand(t);   // рука урока: первый уровень и первый шаг урока механики
  // 1. контейнеры
  if (isA){ drawTopWire(ctx); for (const g of GEO.cont) drawWire(ctx, g, t, g.i === GEO.ghost); }
  else for (const g of GEO.cont) drawTube(ctx, g, t, g.i === GEO.ghost);
  drawDrop(ctx, t);
  // 2. лампы: позы → свечение → спрайты (стоящие, потом летящие и приподнятые)
  const poses = [];
  const add = (l) => { const p = lampPose(l, t), lf = twVal(l.lift, t), look = lampLook(l, t); p.l = l; p.dark = look.dark; p.frost = look.frost; p.goldA = look.goldA;
    p.lit = Math.max(twVal(l.lit, t), lf * 0.9, l.fly && l.top < 0 ? 0.9 : 0) * (1 - look.dark); p.flash = Math.max(0, 1 - (t - l.flashT) / dur(380)) * l.flashK; p.front = !!l.fly || lf > 0.05; poses.push(p); };
  for (const arr of V.cont) for (const l of arr) add(l);
  for (const q of V.gone) for (const l of q.arr) add(l);
  for (const l of V.top) add(l);
  for (const q of poses) drawBulbGlow(ctx, q, t);
  for (const q of poses) if (!q.front) drawBulb(ctx, q, t);
  if (!isA) for (const g of GEO.cont) if (g.i !== GEO.ghost) drawTubeFront(ctx, g, t);
  for (const q of poses) if (q.front) drawBulb(ctx, q, t);
  drawBird(ctx, t);
  // 3. эффекты и подсказки
  drawRings(ctx, t); drawRays(ctx, t); drawParticles(ctx, t); drawNo(ctx, t); drawFloats(ctx, t); drawSpot(ctx, t); drawLesson(ctx, t); drawHint(ctx, t);
  if (G.ending && t >= G.ending) finishWin();
}

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4) ---
let lastFrame = 0;
// Кадр под try/catch: одно исключение в отрисовке не останавливает игру (урок «Отряда НЛО»); ошибки считаются и пишутся в журнал.
function safeRender(){ try { render(); } catch (e) { G.frameErrors++; const m = String(e && e.stack || e).slice(0, 300); if (m !== G.lastError){ G.lastError = m; console.error('[game] frame error: ' + m); } } }
function frame(){ lastFrame = performance.now(); if (!G.paused){ if (!(SKY.on && (G.screen === 'fireworks' || G.screen === 'win'))) safeRender(); try { drawSky(); } catch (e) { log('event', 'frame.error', 'sky ' + (e && e.message)); } } requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, прогон времени, автоигра — только DEV ---

// --- старт ---
document.title = TITLE;
readRemoteConfig(); readPalette(); loadArt(); fit(); hud();
try { if (document.fonts && document.fonts.load) document.fonts.load('800 16px Nunito'); } catch (e) {}
if (!DEV) startLevel(curLevel());   // меты нет: игра сразу открывает текущий уровень, дальше уровни идут друг за другом
requestAnimationFrame(frame);
log('event', 'boot', 'v' + VERSION + ' variant=' + G.v + ' levels=' + LEVELS.a.length + '+' + LEVELS.b.length);
</script>
