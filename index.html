  /* объёмные кнопки (аудит UI 17.11): цвет по смыслу — зелёная «хорошее и спасительное», красная «сброс», нейтральная — остальное.
     top/bot — градиент лица, edge — «толщина» под кнопкой, на неё кнопка проседает при нажатии */
  --g-top:#8be86a; --g-bot:#34b33a; --g-edge:#1c7330; --g-ink:#ffffff;
  --r-top:#ff8a7a; --r-bot:#e8424a; --r-edge:#97202d; --r-ink:#ffffff;
  --n-top:#4c4794; --n-bot:#352f74; --n-edge:#1a163f; --n-ink:#fff8ec;
  --b-top:#3c7d4c; --b-bot:#285f37; --b-edge:#163a21;   /* бустеры внизу (18.11): приглушённый зелёный */
  --btn-edge:5px;                            /* высота «толщины» кнопки, px */
  --frame-w:440px;                           /* расчётная ширина кадра (CFG.FRAME_W) */
  --fk:1;                                    /* масштаб кадра: fitFrame() растягивает его на высоком портретном окне шире расчётного */
}
@media (prefers-color-scheme: light){ :root{ --bg:#15172a; } }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.3 Nunito, system-ui, sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
/* Кадр: расчётная ширина до --frame-w. Если окно шире и портретное (телефон в режиме «версия для ПК» отдаёт ширину 980 px, планшет),
   кадр остаётся расчётной ширины и целиком масштабируется на --fk — игра занимает окно, а не узкую колонку; на десктопе (альбом) --fk = 1.
   --sat/--sab — безопасные зоны в единицах кадра (делятся на масштаб). */
#frame{position:relative;width:min(100vw,var(--frame-w));height:100vh;height:calc(100dvh / var(--fk));height:calc(100svh / var(--fk));margin:0 auto;background:var(--frame);overflow:hidden;
  transform-origin:50% 0;--sat:calc(env(safe-area-inset-top, 0px) / var(--fk));--sab:calc(env(safe-area-inset-bottom, 0px) / var(--fk))}
#frame.zoom{transform:scale(var(--fk))}
#frame.narrow header{gap:4px;padding-left:8px;padding-right:8px} #frame.narrow header .hl,#frame.narrow header .hr{gap:6px} #frame.narrow header .pill{padding:6px 13px 7px;font-size:16px}
#sa{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:var(--sat);padding-bottom:var(--sab)}
#game{position:absolute;inset:0;touch-action:none;-webkit-touch-callout:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Шапка (аудит UI 17.11; 18.11 рестарт ушёл в паузу): слева тихие пауза и звук, по центру номер уровня, справа пусто.
   Счётчик ходов скрыт: без звёзд и рекорда цифра без подписи ничего не значит (элемент остался — журнал и стенды). */
header{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:calc(8px + var(--sat)) 10px 0;pointer-events:none;z-index:3}
header .hl,header .hr{display:flex;gap:8px;align-items:center} header .hr{justify-content:flex-end}
header .pill{background:rgba(16,18,40,.72);border:1.5px solid rgba(255,214,120,.28);border-radius:999px;padding:6px 16px 7px;font-weight:1000;font-size:17px;letter-spacing:.01em;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#hud-moves{display:none}
/* Объёмная кнопка: лицо — градиент, под ним «толщина» --btn-edge; при нажатии (класс .down с касания или :active) проседает на неё.
   Цвет — по смыслу: .go зелёная (Next, Resume, Undo, + wire, подсказка, Got it), .stop красная (Restart), без класса — нейтральная. */
button{font:inherit;font-weight:1000;color:var(--n-ink);border:0;border-radius:16px;padding:11px 18px;cursor:pointer;position:relative;
  --t:var(--n-top);--b:var(--n-bot);--e:var(--n-edge);
  background:linear-gradient(var(--t),var(--b));box-shadow:0 var(--btn-edge) 0 var(--e),0 calc(var(--btn-edge) + 5px) 12px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.28);
  transition:transform .06s,box-shadow .06s;margin-bottom:var(--btn-edge)}
button.go{--t:var(--g-top);--b:var(--g-bot);--e:var(--g-edge);color:var(--g-ink);text-shadow:0 2px 0 rgba(10,70,25,.45)}
button.stop{--t:var(--r-top);--b:var(--r-bot);--e:var(--r-edge);color:var(--r-ink);text-shadow:0 2px 0 rgba(110,15,25,.45)}
button:active,button.down{transform:translateY(calc(var(--btn-edge) - 1px));box-shadow:0 1px 0 var(--e),0 2px 4px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2)}
button[disabled]{--t:#3a3a55;--b:#2c2c44;--e:#17172a;color:rgba(255,248,236,.42);text-shadow:none;cursor:default}
button[disabled]:active,button[disabled].down{transform:none;box-shadow:0 var(--btn-edge) 0 var(--e)}
button[disabled] svg{stroke:rgba(255,248,236,.42)!important} button[disabled] .ad{display:none!important}
button.big{font-size:21px;padding:14px 34px;border-radius:20px}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center;--btn-edge:4px}
.ib svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ib.go{width:48px;height:48px} .ib.go svg{width:25px;height:25px;stroke:#fff;filter:drop-shadow(0 1.5px 0 rgba(10,70,25,.5))}
.ib.stop svg{stroke:#fff;filter:drop-shadow(0 1.5px 0 rgba(110,15,25,.5))}
.ib.off .wave{display:none} .ib:not(.off) .mutex{display:none}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;padding:0 12px calc(8px + var(--sab));pointer-events:none;z-index:3}
/* 17.11: все бустеры (Undo, + Wire, Hint) — в одном ряду внизу, одинаковые: значок над подписью.
   18.11 (Андрей: «пригасить, сделать чуть меньше и красивее»): ниже и уже, приглушённый тёмно-зелёный «стеклянный» лицевой слой
   с тонкой светлой каймой; значок — мятный, подпись — мягкий белый. Зелёный «спасительный» смысл остаётся, но не кричит. */
footer button{pointer-events:auto;border-radius:18px;padding:3px 6px 0;height:54px;font-size:13.5px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:1px;flex:0 1 88px;min-width:0;justify-content:center;line-height:1.05;--btn-edge:4px}
footer button.go{--t:var(--b-top);--b:var(--b-bot);--e:var(--b-edge);color:rgba(236,255,240,.92);text-shadow:0 1px 0 rgba(5,30,14,.6);
  box-shadow:0 var(--btn-edge) 0 var(--e),0 calc(var(--btn-edge) + 4px) 10px rgba(0,0,0,.42),inset 0 1.5px 0 rgba(200,255,215,.22),inset 0 0 0 1.5px rgba(160,240,180,.16)}
footer button.go:active,footer button.go.down{box-shadow:0 1px 0 var(--e),0 2px 4px rgba(0,0,0,.3),inset 0 1.5px 0 rgba(200,255,215,.18),inset 0 0 0 1.5px rgba(160,240,180,.14)}
footer button svg{width:22px;height:22px;flex:none;fill:none;stroke:#bff5cc;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 0 rgba(5,30,14,.55))}
footer button.go[disabled]{--t:#2c3836;--b:#222b2a;--e:#121817;color:rgba(236,255,240,.38);text-shadow:none} footer button.go[disabled] svg{stroke:rgba(200,240,210,.35)!important}
footer .ad{width:22px;height:18px;right:-6px;top:-7px} footer .ad:after{left:8.5px;top:4.5px;border-width:4.5px 0 4.5px 7px}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(8,8,24,.3),rgba(2,2,10,.8));padding:22px;z-index:5}
#overlay.show{display:flex}
#overlay{flex-direction:column}
/* «Out of moves» (18.11, Андрей): сначала надпись прилетает снизу вверх с грустным звуком, потом карточка; под карточкой — «Hold to see the board»:
   удержание вне карточки прячет её и затемнение (видно поле), отпустил — вернулась. Анимации — сдвигом, с видимого состояния (§9). */
#oom{position:absolute;left:0;right:0;top:40%;isolation:isolate;text-align:center;z-index:6;pointer-events:none;font-size:44px;font-weight:1000;line-height:1;display:none;
  color:#dfe4ff;text-shadow:0 4px 0 #2b2160,0 0 26px rgba(120,140,255,.45)}
#oom:before{content:"";position:absolute;left:50%;top:50%;width:440px;height:170px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(4,4,16,.92),rgba(4,4,16,.6) 55%,rgba(4,4,16,0));z-index:-1}
#oom.show{display:block;animation:oomUp .75s cubic-bezier(.2,1.3,.4,1) both}
@keyframes oomUp{from{transform:translateY(46vh) scale(.8)}to{transform:translateY(0) scale(1)}}
#peek{display:none;margin-top:16px;color:#d8d3f0;font-weight:900;font-size:15px;letter-spacing:.02em;padding:8px 16px;border-radius:999px;background:rgba(10,8,30,.55);border:1.5px dashed rgba(216,211,240,.35);pointer-events:auto}
#overlay.stuck #peek{display:block}
#overlay.peek{background:transparent} #overlay.peek .card,#overlay.peek #peek{visibility:hidden}
/* иллюстрация к «+ Wire»: абстрактный провод вырастает от стены, лампа перелетает на него; без анимации — конечный кадр (§9) */
.oom-art{display:block;width:100%;max-width:250px;height:auto;margin:2px auto 10px;overflow:visible}
.oom-art .grow{stroke-dasharray:120;stroke-dashoffset:0;animation:oomGrow 3s ease-out infinite}
.oom-art .tip{animation:oomTip 3s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
.oom-art .hop{animation:oomHop 3s cubic-bezier(.45,0,.3,1) infinite}
@keyframes oomGrow{0%,8%{stroke-dashoffset:120}36%,100%{stroke-dashoffset:0}}
@keyframes oomTip{0%,8%{transform:translateX(0) scale(1)}36%{transform:translateX(104px) scale(1.4)}44%,100%{transform:translateX(104px) scale(.01)}}
.oom-art .tip{transform:translateX(104px) scale(.01)}
@keyframes oomHop{0%,44%{transform:translate(0,0)}66%,100%{transform:translate(-72px,64px)}}
@media (prefers-reduced-motion: reduce){ #oom.show,.oom-art .grow,.oom-art .tip,.oom-art .hop{animation:none} .oom-art .tip{display:none} }
.card{background:linear-gradient(#33296a,#1d1745);border:3.5px solid #f5b53a;border-radius:28px;padding:20px 20px 16px;max-width:340px;width:100%;text-align:center;
  box-shadow:inset 0 0 0 2px rgba(255,236,170,.25),0 0 0 4px rgba(20,12,4,.45),0 20px 50px rgba(0,0,0,.55);animation:pop .28s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow-y:auto} /* стартует с видимого состояния (§9) */
/* заставка (замечание бота 17.11): видна до разбора скриптов; полосу двигает LOADER, обёртке — pfSdk.loadingProgress, на первом кадре — pfSdk.ready() */
#loading{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#07061a;transition:opacity .35s}
#loading.gone{opacity:0;pointer-events:none} #loading[hidden]{display:none}
#load-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;animation:loadArt 1.2s ease-out both}   /* арт заставки (GPT, 17.11): ночь, гирлянды сверху и снизу, середина свободна под название */
@keyframes loadArt{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
#loading:before{content:"";position:absolute;left:50%;top:50%;width:150%;height:34%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(6,5,22,.72),rgba(6,5,22,0));z-index:1}
#load-title{position:relative;z-index:2;font-size:52px;font-weight:1000;line-height:1;letter-spacing:.01em;background:linear-gradient(90deg,#ff5d6c,#ffcf33,#5fe07f,#46c0ff,#c08bff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:loadTitle .7s .15s cubic-bezier(.25,1.6,.5,1) both}
@keyframes loadTitle{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
#load-bar{position:relative;z-index:2;width:220px;height:12px;border-radius:99px;background:rgba(10,8,30,.75);box-shadow:inset 0 2px 3px rgba(0,0,0,.6),0 0 0 2px rgba(255,214,120,.35)}
#load-fill{display:block;position:relative;height:100%;width:6%;border-radius:99px;background:linear-gradient(90deg,#ffb52e,#ffe58a);box-shadow:0 0 12px rgba(255,200,80,.8);transition:width .25s ease-out}
#load-fill:after{content:"";position:absolute;right:-5px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,rgba(255,220,120,.9) 45%,rgba(255,200,80,0) 72%);animation:loadSpark .9s ease-in-out infinite}   /* огонёк на конце полосы */
@keyframes loadSpark{0%,100%{transform:scale(.8);opacity:.75}50%{transform:scale(1.25);opacity:1}}
@media (prefers-reduced-motion: reduce){ #load-art,#load-title,#load-fill:after{animation:none} }
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
/* победа салютом (17.11, как вин-скрин «Половинок»): ночное небо в оверлее, ракеты на холсте #sky под карточкой; сначала название игры, потом наша карточка */
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
#overlay{transition:background .35s} #overlay .card{position:relative;z-index:1}
#overlay.night{background:radial-gradient(120% 70% at 50% 100%,#2a1f5c 0%,#0e0b2a 55%,#05040f 100%)}
.card.sky{background:none;border:0;box-shadow:none;padding:0;pointer-events:none}
.card h2{margin:0 0 4px;font-size:32px;line-height:1.08;font-weight:1000;color:#ffd84a;text-shadow:0 3px 0 #7a3b06,0 0 2px #7a3b06;letter-spacing:.005em}
.card p{color:#e3def5;margin:0 0 14px;font-weight:800;font-size:16.5px}
.card .col button{width:100%;display:flex;align-items:center;justify-content:center;gap:9px}
.card button svg{width:22px;height:22px;flex:0 0 22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.card button.go svg{filter:drop-shadow(0 1.5px 0 rgba(10,70,25,.45))} .card button.stop svg{filter:drop-shadow(0 1.5px 0 rgba(110,15,25,.45))}
.card button.quiet,.card button.cheat{box-shadow:none;margin-bottom:0;background:transparent;transform:none}
.card button.quiet{color:var(--muted);font-size:14px;padding:6px 10px;text-decoration:underline;text-underline-offset:3px}
/* победа (18.11, Андрей: «без попапа, лампочки загораются переливом, появляется надпись Great и начинается следующий уровень»):
   крупная похвала поверх ламп в темноте, без карточки и кнопок; анимация — масштабом, с видимого состояния (§9) */
.great{font-size:60px;font-weight:1000;line-height:1;letter-spacing:.01em;background:linear-gradient(90deg,#ff5d6c,#ffcf33,#5fe07f,#46c0ff,#c08bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(255,214,120,.35));animation:greatIn .55s cubic-bezier(.25,1.7,.5,1) both}
.great-sub{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold);font-weight:1000;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.5);animation:greatIn .5s .12s cubic-bezier(.25,1.7,.5,1) both}
.great-sub img{width:30px;height:30px}
@keyframes greatIn{from{transform:scale(.35) rotate(-6deg)}to{transform:scale(1) rotate(0)}}
.logo{font-size:38px;font-weight:1000;line-height:1.02;margin:2px 0 4px;background:linear-gradient(90deg,#ff4f5e,#ffcf33,#57d977,#3fb8ff,#b77bff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.sub{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:800;letter-spacing:.02em}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
/* переключатель вариантов A/B */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#17132f;border-radius:18px;padding:5px;margin:0 0 14px}
.seg button{box-shadow:none;margin-bottom:0;padding:9px 4px 8px;border-radius:14px;background:transparent;color:var(--muted);font-size:15px;line-height:1.15}
.seg button small{display:block;font-size:11px;font-weight:800;opacity:.85}
.seg button.on{background:#3a2f6c;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(255,214,120,.45)}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 4px}
.levels button{margin-bottom:0;--btn-edge:3px;padding:8px 0 6px;font-size:17px;border-radius:14px;background:#3a2f6c;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-height:44px;justify-content:center}
.levels button small{font-size:10px;line-height:10px;height:10px;display:block}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 1px}
.levels button.locked{opacity:.32}
.levels button.cur{outline:2.5px solid var(--accent)}
.levels.many{grid-template-columns:repeat(6,1fr);gap:5px;margin:10px 0 2px}
.levels.many button{font-size:15px;min-height:37px;padding:5px 0 3px;border-radius:11px}
.levels button.gold{box-shadow:inset 0 0 0 2px var(--gold)}
.levels button.new{background:#4a3a86;position:relative}  /* уровень, где впервые встречается механика: в углу её значок */
.levels .mi{position:absolute;right:-2px;top:-6px;width:17px;height:17px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.levels i.mi{width:11px;height:11px;right:0;top:-4px;border-radius:4px;background:linear-gradient(#ff4f5e,#b77bff);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}
.levels i.mi.svg{width:18px;height:18px;right:-3px;top:-7px;background:none;box-shadow:none} .levels i.mi.svg svg{width:100%;height:100%;display:block}
.goldrow.total{margin:8px 0 2px;font-size:14px} .goldrow.total img{width:20px;height:20px}
.cheat.sure{border-style:solid;border-color:var(--danger);color:var(--danger)}
/* лампочка-подсказка мигает, когда игрок давно не ходил; толчок кнопки запасного провода при первом показе. Обе анимации стартуют с видимого состояния (§9) */
/* кольцо вокруг кнопки — отдельным слоем, чтобы не сбивать «толщину» кнопки (box-shadow) */
.ib.nudge,footer button.nudge{animation:nudge 1.5s ease-in-out infinite}
.ib.nudge:before,footer button.nudge:before,footer button.pulse:before{content:"";position:absolute;inset:-6px;border-radius:inherit;border:3px solid rgba(255,241,160,.9);pointer-events:none;animation:ring 1.5s ease-out infinite}
footer button.pulse:before{animation:ring .8s ease-out 2 forwards}   /* forwards: после двух вспышек кольцо остаётся невидимым, а не повисает рамкой */
@keyframes nudge{0%,100%{scale:1}50%{scale:1.08}}
@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.3);opacity:0}}
footer button.pulse{animation:pulse .8s ease-in-out 2}
.ib.stop.arm{scale:1.18;transition:scale .12s} .ib.stop.arm:before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(255,140,130,.95);pointer-events:none;animation:ring .7s ease-out infinite}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.09}}
.goldrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:-4px 0 12px;color:var(--gold);font-weight:900}
.goldrow img{width:30px;height:30px;object-fit:contain} .card.win .goldrow{font-size:17px;margin:0 0 14px}
.goldrow.miss{color:var(--muted)} .goldrow.miss img{filter:grayscale(1);opacity:.55}
.how.mech{font-size:14px;border-top:1.5px solid rgba(255,255,255,.1);padding-top:6px} .how.mech li{margin:8px 0}
.how.mech img,.how.mech svg{flex:0 0 26px;width:26px;height:26px;object-fit:contain;margin-top:-1px}
/* замок — CSS-формой, не глифом (глиф вне шрифта = кадр 1 с) */
.lock{width:12px;height:10px;border-radius:2px;background:var(--muted);position:relative;margin-top:7px}
.lock:before{content:"";position:absolute;left:2px;top:-7px;width:8px;height:8px;border:2px solid var(--muted);border-bottom:0;border-radius:5px 5px 0 0;box-sizing:border-box}
.ver{margin-top:8px;font-size:11px;color:var(--muted);opacity:.6;font-weight:800}
.cheat{margin-top:8px;font-size:12px;padding:6px 10px;background:transparent;border:1.5px dashed var(--muted);color:var(--muted);border-radius:12px;box-shadow:none}
.stars{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.star{width:52px;height:52px;background:#40376c;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.on{background:linear-gradient(#fff2a8,#ffcf33 55%,#ff9a3c);animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.stars .star:nth-child(2){transform:translateY(-8px)}
@keyframes starIn{from{transform:scale(1.6) rotate(-20deg)}to{transform:scale(1)}}
.stars .star.on:nth-child(2){animation-name:starIn2}
@keyframes starIn2{from{transform:translateY(-8px) scale(1.6) rotate(-20deg)}to{transform:translateY(-8px) scale(1)}}
.how{text-align:left;color:#d9d4ee;margin:0 0 12px;padding-left:0;list-style:none;font-weight:700;font-size:15px;line-height:1.28} .how li{margin:7px 0;display:flex;gap:9px;align-items:flex-start} .how b{color:var(--ink)}
.how .n{flex:0 0 24px;height:24px;border-radius:50%;background:linear-gradient(var(--g-top),var(--g-bot));color:#fff;font-weight:1000;font-size:14px;display:grid;place-items:center;box-shadow:0 2px 0 var(--g-edge)}
.card.help{display:flex;flex-direction:column;padding-bottom:12px} .card.help .hb{overflow-y:auto;min-height:0;flex:1 1 auto;margin:0 -8px;padding:0 8px;overscroll-behavior:contain}
.card.help > button{flex:0 0 auto;margin-top:8px}
#toast{position:absolute;left:50%;top:calc(60px + var(--sat));transform:translateX(-50%);background:rgba(255,248,230,.96);color:var(--ink-dark);padding:9px 16px;border-radius:14px;
  pointer-events:none;opacity:.98;transition:opacity .25s;white-space:nowrap;z-index:4;font-weight:900;font-size:14px}
#toast.hide{opacity:0}
/* значок «за рекламу» на кнопке: следующая подсказка или запасной провод — за ролик (showRewarded) */
.ad{display:none;position:absolute;right:-7px;top:-9px;width:26px;height:21px;border-radius:7px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.35),0 0 0 2px rgba(10,12,30,.5);pointer-events:none}
.ad:after{content:"";position:absolute;left:10px;top:5.5px;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #17142e}
.card button .ad{position:static;display:none;margin-left:auto} .card button.adon .ad{display:inline-block;flex:0 0 26px;position:relative;right:auto;top:auto}
.ib.adon .ad,footer button.adon .ad{display:block}
.ib .ad{right:-9px;top:-7px}
/* карта уровней: 500 кнопок — прокрутка внутри карточки, текущий уровень виден сразу */
.lvwrap{max-height:min(44vh,300px);overflow-y:auto;margin:10px -4px 2px;padding:6px 4px 2px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lvwrap .levels{margin:0}
.card .col{display:flex;flex-direction:column;gap:9px;align-items:stretch;margin-top:4px}
/* рука-подсказка на кнопке (Undo, + wire) на уровне её открытия: DOM поверх кнопок и карточек, ввод не перехватывает */
/* 18.11 (Андрей: «нормальный классный туториальный палец»): рука — арт GPT (assets/hand.png, кончик пальца — 43,6 % ширины, верх), с тенью и нажатием */
#coach{position:absolute;left:0;top:0;width:40px;height:62px;margin:0 0 0 -17.4px;pointer-events:none;z-index:7;transform-origin:17.4px 0;animation:coachTap 1.1s ease-in-out infinite}
#coach.hide{display:none}
header,footer{transition:opacity .3s} #frame.focus header,#frame.focus footer{opacity:.38}   /* фокус урока: шапка и кнопки притухают вместе с полем */
#coach:before{content:"";position:absolute;left:-4.6px;top:-22px;width:44px;height:44px;border-radius:50%;border:2.5px solid rgba(255,255,255,.85);animation:coachRing 1.1s ease-out infinite}
#coach img{display:block;width:40px;height:62px;filter:drop-shadow(0 6px 5px rgba(0,0,0,.5))}
@keyframes coachTap{0%,100%{transform:translate(6px,14px) rotate(-20deg)}45%{transform:translate(0,3px) rotate(-20deg) scale(.9)}}
#coach.down{animation-name:coachTapDown}   /* кнопки у нижнего края: рука сверху, указывает вниз */
@keyframes coachTapDown{0%,100%{transform:translate(-6px,-14px) rotate(160deg)}45%{transform:translate(0,-3px) rotate(160deg) scale(.9)}}
@keyframes coachRing{0%,40%{transform:scale(.4);opacity:0}50%{opacity:1}100%{transform:scale(1.15);opacity:0}}
@media (prefers-reduced-motion: reduce){ #coach,#coach:before{animation:none} }
.adbar{height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin:-4px 18px 16px;overflow:hidden} .adbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffe066,#ffb22e);transform-origin:0 50%;animation:adbar linear both}
@keyframes adbar{from{transform:scaleX(.04)}to{transform:scaleX(1)}}
.adbox{margin:8px auto 14px;width:150px;height:96px;border-radius:18px;display:grid;place-items:center;font-size:34px;font-weight:1000;color:var(--ink-dark);background:linear-gradient(#ffe066,#ffb22e)}
@media (prefers-reduced-motion: reduce){ .card,.ib.nudge,footer button.nudge,footer button.nudge:before,footer button.pulse,.ib.nudge:before,footer button.pulse:before,.great,.great-sub{animation:none} #toast{transition:none} }
</style>
</head>

<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// «Гирлянда: сортировка» — сортировка лампочек, два варианта правил (RULES):
//   a «Провода» — как Bird Sort: лампы висят на проводах, крайняя у свободного конца — «верхняя».
//       Ход: с провода снимается вся крайняя группа ламп одного цвета и перелетает на другой провод,
//       если он пуст или его крайняя лампа того же цвета; влезает столько, сколько есть места.
//       Провод, на котором собрались все лампы цвета (и только они), загорается и гирлянда улетает — провод свободен.
//   b «Колбы» — классическая сортировка шариков: лампы стопкой в колбах, за ход переносится одна верхняя лампа
//       на пустую колбу или на лампу того же цвета. Собранная колба загорается и запирается (остаётся на месте).
// Провод/колба = «контейнер»: строка цифр-цветов от закреплённого конца (дна) к свободному, caps[i] — вместимость.
// Победа — собраны все цвета. Проигрыша нет: тупик лечится отменой, запасным контейнером (бустер) или рестартом.
// Контракт для sim.mjs/test.mjs: CFG, RULES, LEVELS, mulberry32, createState, legalMoves, applyMove, undoMove,
// addSpare, isWin, isStuck, solveInfo, solve, hintMove, starsFor, randomRun, noviceRun.
// ---------------------------------------------------------------------------
const CFG = {
  // --- правила ---
  START_MAX_RUN: 2,       // на старте в контейнере подряд не больше стольких ламп одного цвета (тройка — почти готовый цвет даром)
  SPARE_PER_LEVEL: 1,     // сколько запасных контейнеров можно добавить за уровень (бустер «+ провод / + колба»)
  STAR3_K: 1.3,           // 3 звезды: ходов ≤ par × STAR3_K (par — минимум солвера, записан в LEVELS)
  STAR2_K: 1.8,           // 2 звезды: ходов ≤ par × STAR2_K
  // --- солвер и боты ---
  SOLVE_NODES: 500000,    // лимит узлов A* в симуляторе (точный par)
  HINT_NODES: 30000,      // лимит узлов для подсказки в игре (взвешенный A*, быстро и не обязательно кратчайше)
  HINT_WEIGHT: 2,         // вес эвристики для подсказки
  BOT_MOVE_CAP: 160,      // бот сдаётся после стольких ходов
  // --- раскладка, виртуальные юниты при ширине кадра 400 ---
  VW: 400,                // виртуальная ширина кадра
  BULB_R: 14,             // «радиус» лампы: высота спрайта = R × BULB_H_K
  BULB_H_K: 3.1,          // высота спрайта лампы в радиусах
  BULB_HOOK_K: 0.12,      // доля высоты спрайта над точкой подвеса (цоколь заходит на провод)
  A_TOP: 122,             // вариант a: верх поля (под итоговой гирляндой), от верха кадра
  A_BOTTOM: 84,           // вариант a: отступ поля от низа кадра (ряд бустеров)
  A_ROW_MIN: 66, A_ROW_MAX: 104,  // высота ряда проводов
  A_WALL: 20,             // отступ первой лампы от стены
  A_STEP: 40, A_STEP5: 33,        // шаг ламп на проводе при вместимости ≤4 и 5 (при k = 1)
  A_K_MAX: 1.6,           // вариант a: насколько крупнее лампы, когда проводов мало и место есть (16.11, Андрей: «крупнее и сочнее»)
  A_FILL: 0.88,           // доля шага, которую занимает ширина лампы: больше — лампы касаются друг друга
  BULB_W_K: 1.9,          // ширина спрайта лампы в радиусах (спрайт 59×96 при высоте 3,1 R)
  A_SAG: 5,               // провис провода
  A_LIFT: 14,             // на сколько приподнимаются выбранные лампы
  TOP_Y: 78,              // итоговая гирлянда сверху: высота подвеса
  TOP_SAG: 16,            // её провис
  TOP_SCALE: 0.56,        // масштаб ламп на итоговой гирлянде
  TOP_SOCKET: '#56607f',  // цвет пустого патрона итоговой гирлянды (прогресс уровня)
  GHOST_A: 0.5,           // яркость пунктирного места запасного провода (было 0.34 — почти не видно)
  B_TOP: 112, B_BOTTOM: 78,       // вариант b: поле
  B_TUBE_W: 40,           // внутренняя ширина колбы
  B_SLOT: 37,             // шаг ламп в колбе по высоте
  B_GAP: 26,              // зазор между колбами
  B_LIFT: 6,              // зазор между горлышком и приподнятой лампой
  B_BULB_R: 13.5,         // «радиус» лампы в колбе
  B_ROW_GAP: 58,          // зазор между рядами колб (место под приподнятую лампу)
  HIT_PAD: 12,            // запас зоны попадания вокруг контейнера
  FRAME_W: 440,           // расчётная ширина кадра, CSS px (то же число в --frame-w)
  FRAME_MIN_H: 720,       // кадр, растянутый на широкое портретное окно, не становится ниже этой расчётной высоты (иначе берётся масштаб по высоте)
  FRAME_NARROW: 410,      // кадр уже этого — компактная шапка
  CANVAS_MAX_W: 1100,     // потолок ширины холста в пикселях устройства: окно 980 px × DPR 2 дало бы холст на 8 Мп
  // --- ввод (всё в виртуальных юнитах: в окне «версии для ПК» CSS-пиксель втрое мельче пальца) ---
  DRAG_PX: 10,            // порог тап/драг: сдвинул палец дальше — лампы пошли за пальцем
  DRAG_ARM: 26,           // перетаскивание «взведено», когда палец ушёл от точки касания дальше этого; до того отпускание = тап (лампы остаются приподнятыми)
  DRAG_GAP: 26,           // зазор между пальцем и низом несомой лампы (лампа видна над пальцем)
  DRAG_GRAB_MS: 90,       // подхват: за столько лампы приходят с провода к пальцу, дальше идут за ним жёстко
  DROP_SNAP_K: 0.8,       // радиус прилипания к подходящему проводу, в высотах ряда: лампа ближе — провод подсвечен, отпустил — сели
  DROP_BIAS_K: 0.2,       // фора подходящему проводу перед неподходящим соседом, в высотах ряда
  DROP_FINGER_PEN: 12,    // провод под самим пальцем тоже считается, но со штрафом: при прочих равных решает лампа

// Детерминированный генератор случайных чисел (PROTO-BASE §5). Math.random() не используется.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// p — позиция { T, ice, plug, box, wave }: ice — обледеневший провод, plug — выключенный вилкой провод (-1 — нет),

// Сколько ламп перелетит ходом a → b (0 — ход невозможен).

// ДОВОЗ: связки из коробки садятся на пустые провода — сначала на самые длинные (выбор не зависит от порядка одинаковых проводов),

  ok(){ return this.ac && !G.save.muted && !G.paused; },
  suspend(){ try { if (this.ac && this.ac.state === 'running') this.ac.suspend(); } catch (e) {} },          // пауза и фон: звук молчит целиком
  wake(){ try { if (this.ac && !G.paused && this.ac.state === 'suspended') this.ac.resume(); } catch (e) {} },
  env(g, t, vol, atk, ms){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + atk); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000); },
  tone(freq, ms, type, vol, at, glideTo, wet){
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (at || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + ms / 1000);
    this.env(g, t, vol || 0.2, 0.006, ms);
    o.connect(g); g.connect(this.out); if (wet) g.connect(this.wet);
    o.start(t); o.stop(t + ms / 1000 + 0.03);
  },
  bell(freq, at, vol){                 // стеклянный колокольчик: основной тон + негармонические обертоны, с эхом
    this.tone(freq, 900, 'sine', vol, at, 0, true);
    this.tone(freq * 2.76, 380, 'sine', vol * 0.35, at, 0, true);
    this.tone(freq * 5.4, 160, 'sine', vol * 0.12, at, 0, true);
  },
  hiss(ms, filt, freq, vol, at, q){
    if (!this.ok()) return;
    const ac = this.ac, t = ac.currentTime + (at || 0), src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noise; f.type = filt; f.frequency.value = freq; if (q) f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + ms / 1000);
    src.connect(f).connect(g).connect(this.out); src.start(t, (at || 0) % 0.3); src.stop(t + ms / 1000 + 0.02);
  },
  note(step){ return 523.25 * Math.pow(2, PENTA[Math.max(0, Math.min(Math.round(step) || 0, PENTA.length - 1))] / 12); },
  ui(){ this.tone(640, 50, 'triangle', 0.06); log('sound', 'ui'); },
  aim(){ this.tone(1180, 26, 'sine', 0.035); },          // перетаскивание: лампа навелась на провод
  pick(n){ const f = 392 * Math.pow(2, PENTA[Math.max(0, Math.min((n || 1) - 1, 4))] / 12); this.hiss(28, 'bandpass', 2600, 0.16, 0, 3); this.tone(f, 70, 'triangle', 0.07, 0, f * 1.35); log('sound', 'pick'); },   // чем больше ламп снялось — тем выше
  fly(n){ this.hiss(150 + 40 * Math.min(n, 4), 'bandpass', 1300, 0.045, 0, 0.7); this.tone(300, 150, 'sine', 0.022, 0, 640); log('sound', 'fly'); },   // взлёт группы: мягкий «фух»
  land(step){ this.hiss(20, 'bandpass', 2200, 0.3, 0, 4); this.tone(150, 80, 'sine', 0.16, 0, 80); this.bell(this.note(step), 0.01, 0.055); log('sound', 'land'); },
  kiss(size){                          // «поцелуй»: парный аккорд совпавших ламп (чем длиннее группа — тем выше), искра тока, блёстки
    const b = 1 + size * 2;
    this.bell(this.note(b), 0.02, 0.1); this.bell(this.note(b + 2), 0.02, 0.075);
    this.tone(1800, 110, 'sawtooth', 0.02, 0.01, 5000);
    this.hiss(220, 'highpass', 6000, 0.05, 0.04);
    log('sound', 'kiss', 'size=' + size);
  },
  waveNote(j){ this.bell(this.note(3 + j), 0, 0.09); },
  complete(k){ const up = PENTA[Math.max(0, Math.min(k || 0, 5))]; [0, 4, 7, 12].forEach(s => this.tone(261.63 * Math.pow(2, (s + up) / 12), 1300, 'triangle', 0.05, 0, 0, true));   // каждая следующая гирлянда уровня — аккорд выше
    this.hiss(520, 'bandpass', 3200, 0.1, 0, 1.5); log('sound', 'complete'); },
  leave(){ this.hiss(420, 'highpass', 2500, 0.08); this.tone(480, 380, 'sine', 0.05, 0, 1500); log('sound', 'leave'); },
  ting(k){ this.bell(this.note(7 + (k % 5)), 0, 0.04); },
  cap(){ this.tone(220, 120, 'sine', 0.2, 0, 110); this.hiss(40, 'bandpass', 1500, 0.3, 0, 2); this.bell(this.note(9), 0.05, 0.07); log('sound', 'cap'); },
  bad(){ this.tone(196, 90, 'sine', 0.12, 0, 165); this.tone(156, 130, 'sine', 0.1, 0.085, 131); this.hiss(40, 'lowpass', 700, 0.06); log('sound', 'bad'); },   // мягкое «не-а»: два глухих тука вниз, не зуммер
  full(){ this.tone(131, 110, 'sine', 0.14, 0, 98); this.hiss(50, 'lowpass', 500, 0.09); log('sound', 'full'); },   // нет места: один глухой стук
  undo(){ this.tone(560, 130, 'triangle', 0.09, 0, 300); log('sound', 'undo'); },
  spare(){ this.tone(300, 240, 'triangle', 0.09, 0, 900); this.bell(this.note(6), 0.16, 0.06); log('sound', 'spare'); },
  stuck(){ this.bell(392, 0, 0.07); this.bell(330, 0.22, 0.07); log('sound', 'stuck'); },
  introZip(){ this.hiss(380, 'bandpass', 2400, 0.05, 0, 0.9); this.tone(220, 380, 'sine', 0.035, 0, 520); log('sound', 'intro'); },   // провода вытягиваются: мягкое «вжух»
  sad(){ this.tone(392, 300, 'triangle', 0.09, 0, 370); this.tone(349, 300, 'triangle', 0.09, 0.28, 330); this.tone(311, 760, 'triangle', 0.09, 0.56, 247);   // «Out of moves»: грустное «уа-уа-уаа» вниз
    this.tone(155, 900, 'sine', 0.06, 0.56, 123); log('sound', 'sad'); },
  grow(){ this.hiss(520, 'bandpass', 1800, 0.06, 0, 0.8); this.tone(260, 560, 'triangle', 0.07, 0, 780); [6, 8, 10, 12].forEach((k, i) => this.bell(this.note(k), 0.5 + i * 0.07, 0.07)); log('sound', 'grow'); },   // провод вырастает и щёлкает патронами
  // --- механики ---
  glint(){ this.tone(3300, 120, 'sine', 0.035, 0, 0, true); this.tone(4400, 180, 'sine', 0.028, 0.07, 0, true); log('sound', 'glint'); },   // блик по льду: новая механика
  iceTap(){ this.tone(2400, 70, 'sine', 0.06, 0, 1700); this.tone(3300, 110, 'sine', 0.04, 0.03, 0, true); this.hiss(50, 'highpass', 5000, 0.12); log('sound', 'ice.tap'); },   // стук по льду: не снимается
  crack(at){ this.hiss(70, 'highpass', 3400, 0.2, at || 0, 2); this.tone(1900, 50, 'square', 0.03, at || 0, 700); },
  thaw(){ [0, 0.09, 0.21, 0.34].forEach(a => this.crack(a)); this.tone(220, 900, 'sine', 0.07, 0.08, 440, true); [7, 9, 12].forEach((s, i) => this.bell(this.note(s), 0.26 + i * 0.1, 0.05)); log('sound', 'thaw'); },
  reveal(col){ this.hiss(18, 'bandpass', 1800, 0.3, 0, 5); this.tone(900, 40, 'square', 0.04); this.bell(this.note(4 + col), 0.03, 0.09); log('sound', 'reveal'); },   // щелчок: тёмная лампа загорелась
  pearl(){ [5, 8, 10].forEach((s, i) => this.bell(this.note(s), i * 0.05, 0.06)); this.hiss(260, 'highpass', 7000, 0.04); log('sound', 'pearl'); },
  plugIn(){ this.hiss(30, 'bandpass', 1800, 0.35, 0, 3); this.tone(180, 90, 'square', 0.05, 0, 120); this.tone(120, 700, 'sawtooth', 0.025, 0.06, 240, true); this.bell(this.note(9), 0.12, 0.08); this.bell(this.note(12), 0.2, 0.06); log('sound', 'plug.in'); },   // щелчок вилки, гудение тока, провод ожил
  plugNo(){ this.tone(110, 160, 'sawtooth', 0.05, 0, 95); this.hiss(60, 'bandpass', 900, 0.12, 0, 2); log('sound', 'plug.no'); },   // выключенный провод: глухое «бзз»
  boxOpen(){ this.tone(140, 120, 'sine', 0.16, 0, 90); this.hiss(160, 'lowpass', 1400, 0.18, 0.02); this.hiss(90, 'bandpass', 2600, 0.1, 0.12, 2); log('sound', 'box.open'); },   // картонный хлопок и шорох
  boxOut(k){ this.tone(320 + 60 * (k || 0), 260, 'sine', 0.05, 0, 820); this.hiss(200, 'bandpass', 1500, 0.05, 0, 0.8); log('sound', 'box.out'); },   // связка вылетает из коробки
  tick(left){ const hot = left <= CFG.GOLD_WARN; this.tone(hot ? 1500 : 1100, 35, 'square', 0.035); this.tone(hot ? 2250 : 1650, 60, 'sine', 0.04, 0.02); },
  gold(){ [0, 4, 7, 12, 16, 19].forEach((s, i) => this.bell(659.25 * Math.pow(2, s / 12), i * 0.07, 0.09)); [0, 7, 12].forEach(s => this.tone(329.63 * Math.pow(2, s / 12), 1200, 'triangle', 0.05, 0.1, 0, true)); this.hiss(500, 'highpass', 6500, 0.07, 0.05); log('sound', 'gold'); },
  goldLost(){ this.tone(700, 380, 'triangle', 0.08, 0, 160); this.hiss(300, 'lowpass', 1200, 0.1); log('sound', 'gold.lost'); },
  sockNo(){ this.tone(240, 120, 'triangle', 0.14, 0, 180); this.bell(this.note(2), 0.02, 0.04); log('sound', 'sock.no'); },
  great(){ [0, 4, 7, 12].forEach((k, i) => this.bell(this.note(k + 2), i * 0.06, 0.08)); this.tone(523.25, 700, 'triangle', 0.05, 0.05, 0, true); this.hiss(300, 'highpass', 6500, 0.05); log('sound', 'great'); },
  win(){ [0, 2, 4, 7, 9, 12].forEach((k, i) => this.bell(this.note(k + 1), i * 0.11, 0.09)); [0, 4, 7, 12].forEach(s => this.tone(261.63 * Math.pow(2, s / 12), 1800, 'triangle', 0.045, 0.6, 0, true)); log('sound', 'win'); },
};
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

// --- экраны: DOM-оверлеи, любой открывается кодом или хешем (§6, §11) ---
const $ = (id) => document.getElementById(id);
// Иконки кнопок карточек (контур, цвет — от текста кнопки) и значок ролика (за награду).
const ICON = {
  undo: '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  restart: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  socket: '<svg viewBox="0 0 26 26"><path d="M1 6.5Q13 9 25 6.5" stroke="#6fae82" stroke-width="2.4" fill="none" stroke-linecap="round"/><rect x="9" y="7" width="8" height="6" rx="2" fill="#57d977"/><path d="M13 13c-4.6 0-5.8 4.4-3.6 8.6 1.1 2.1 6.1 2.1 7.2 0 2.2-4.2 1-8.6-3.6-8.6z" fill="none" stroke="#57d977" stroke-width="1.8" opacity=".75"/></svg>',
};
const AD_BADGE = '<i class="ad"></i>';
// Похвала на экране победы — по номеру уровня, без случайности (§5); первая — «Great!», как сказал Андрей 18.11
const PRAISE = ['Great!', 'Awesome!', 'Great!', 'Brilliant!', 'Great!', 'Superb!'];
const starsHtml = (n) => '<div class="stars">' + [0, 1, 2].map(k => '<i class="star' + (k < n ? ' on' : '') + '" style="--d:' + (k * 0.18) + 's"></i>').join('') + '</div>';
const levelsOf = (v) => LEVELS[v];
// Линейка: в «Проводах» номер уровня не кончается — после 500-го круг с RC.LOOP_FROM (loopIndex в ядре), в «Колбах» — 10 уровней.
// n — уровень по порядку с нуля (то, что видит игрок, минус один); li — индекс строки в LEVELS.
const lvTotal = (v) => LEVELS[v].length;
const lvIndex = (n, v) => v === 'a' ? loopIndex(n, lvTotal('a'), RC.LOOP_FROM) : Math.max(0, Math.min(lvTotal(v) - 1, n | 0));
const curLevel = (v) => { v = v || G.v; return v === 'a' ? G.save.level.a : Math.min(G.save.level[v], lvTotal(v) - 1); };
const levelNo = (s) => (s ? s.no : 0) + 1;   // номер на экране и в журнале
// Уровень открыт, если до него дошёл прогресс варианта или включён чит «открыть все уровни» (PROTO-BASE §6, только DEV).
function isOpen(n, v){ return (DEV && G.save.unlockAll) || n <= G.save.level[v || G.v]; }
function setVariant(v){ G.v = v === 'b' ? 'b' : 'a'; G.save.v = G.v; save(); log('event', 'variant', G.v); }
// level.quit: игрок ушёл из начатого уровня (QUIT LEVEL в паузе — всегда; выбор другого уровня в меню — если ходы были). Пройденный не отмечается.
function quitMark(reason){
  const s = G.s; if (!s || s.quit || isWin(s) || (reason !== 'quit' && !s.moves)) return;
  s.quit = true; log('event', 'level.quit', 'level=' + levelNo(s) + ' moves=' + s.moves + ' reason=' + reason);
}
function goto(screen, payload){
  G.screen = screen; log('screen', screen, G.v);
  const ov = $('overlay'), card = $('card');
  card.className = 'card'; ov.classList.remove('night', 'stuck', 'peek');
  if (screen !== 'win' && SKY.on){ SKY.on = false; if (SKY.cv) SKY.cv.getContext('2d').clearRect(0, 0, SKY.cv.width, SKY.cv.height); }   // реклама, следующий уровень — небо чистое сразу
  if (screen === 'game'){ ov.classList.remove('show'); hud(); return; }
  ov.classList.add('show');
  const R = RULES[G.v], LV = levelsOf(G.v), cur = curLevel();
  if (screen === 'menu'){
    let lv = '';
    for (let i = 0; i < LV.length; i++){
      const st = G.save.best[G.v][i] || 0;
      const mi = LV[i].intro ? (MECH_ICON[LV[i].intro] ? `<img class="mi" src="${artSrc(MECH_ICON[LV[i].intro])}" alt="">` : MECH_SVG[LV[i].intro] ? `<i class="mi svg">${MECH_SVG[LV[i].intro]}</i>` : '<i class="mi"></i>') : '';   // значок механики, которая здесь появляется
      lv += isOpen(i) ? `<button data-act="lvl" data-li="${i}" class="${i === cur ? 'cur' : ''}${G.save.gold[G.v][i] ? ' gold' : ''}${LV[i].intro ? ' new' : ''}">${mi}${i + 1}<small>${st ? '<i class="dot"></i>'.repeat(st) : '&nbsp;'}</small></button>`
                      : `<button data-act="lvl" data-li="${i}" class="locked"><i class="lock"></i></button>`;
    }
    const goldAll = LV.filter(L => L.mech && L.mech.gold).length, goldN = Object.keys(G.save.gold[G.v]).length, goldFrom = LV.findIndex(L => L.mech && L.mech.gold);
    const goldRow = goldAll && isOpen(goldFrom) ? `<div class="goldrow total"><img src="${artSrc('spark-gold')}" alt="">Gold bulbs: ${goldN} of ${goldAll}</div>` : '';   // куда складывается награда золотой
    card.innerHTML = `<div class="logo">${TITLE}</div><div class="sub">sort the bulbs, light the garlands</div>
      ${DEV ? devVariantHtml() : ''}
      <button class="go big" data-act="play">Play · ${cur + 1}</button>
      <div class="lvwrap" id="lvwrap"><div class="levels${LV.length > 10 ? ' many' : ''}">${lv}</div></div>${goldRow}
      <div class="row"><button data-act="help">How to play</button></div>
      ${DEV ? devToolsHtml() + '<div class="ve' + 'r">v' + VERSION + '</div>' : ''}`;
    const w = $('lvwrap'), b = w && w.querySelector('.cur');   // текущий уровень — в середине прокрутки
    if (!b && w && cur >= LV.length) w.scrollTop = w.scrollHeight;   // круг после 500-го: карта прокручена к концу
    if (b){ const rw = w.getBoundingClientRect(), rb = b.getBoundingClientRect(); w.scrollTop = Math.max(0, rb.top - rw.top + w.scrollTop - w.clientHeight / 2 + rb.height / 2); }
  }
  if (screen === 'pause'){
    card.innerHTML = `<h2>Paused</h2><p>Level ${levelNo(G.s)}</p>
      <div class="col"><button class="go big" data-act="resume">${ICON.play}Resume</button><button class="stop" data-act="restart">${ICON.restart}Restart</button>
      <button data-act="help">How to play</button>${sdkSettings() ? '<button class="quiet" data-act="privacy">Privacy &amp; support</button>' : ''}${DEV ? '<button class="cheat" data-act="menu">Levels (dev)</button>' : ''}</div>${DEV ? '<div class="ve' + 'r">v' + VERSION + '</div>' : ''}`;
  }
  if (screen === 'help'){                                 // шаги с номерами; механики — строкой с иконкой; прокручивается середина, «Got it» всегда видна
    card.className = 'card help';
    const step = (n, html) => `<li><span class="n">${n}</span><span>${html}</span></li>`;
    card.innerHTML = G.v === 'a'
      ? `<h2>How to play</h2><div class="hb"><ul class="how">${step(1, 'Tap a wire — its <b>end bulbs of one color</b> lift up.')}${step(2, 'Tap another wire — they fly over if it is empty or ends with <b>the same color</b>.')}
         ${step(3, 'All bulbs of a color on one wire <b>light up</b> and fly to the top.')}${step(4, 'Stuck? <b>Undo</b> a move or add a <b>wire</b>.')}</ul>${mechHelp()}</div><button class="go big" data-act="back">Got it</button>`
      : `<h2>Jars</h2><div class="hb"><ul class="how">${step(1, 'Tap a jar — the <b>top bulb</b> lifts up.')}${step(2, 'Tap another jar — the bulb drops in if the jar is empty or its top bulb is <b>the same color</b>.')}
         ${step(3, 'All bulbs of a color in one jar <b>light up</b> and close.')}${step(4, 'Stuck? Use Undo or a spare jar.')}</ul></div><button class="go big" data-act="back">Got it</button>`;
  }
  if (screen === 'win'){ ov.classList.add('night'); card.className = 'card sky'; card.innerHTML = ''; return; }   // победа: лампы в темноте, похвала появится сама (drawSky), карточки и кнопок нет
  if (screen === 'stuck'){
    // 18.11 (Андрей): «предлагаем только провод (… вряд ли хинт решит проблему)». Главное — + Wire (за ролик, если не уровень открытия)
    // с иллюстрацией, ниже — Restart (красный). Провода нет (взят или ещё не открыт) — Restart крупно. Undo — только на уровне его открытия
    // (бесплатный урок кнопки, рука укажет на неё); дальше в карточке его нет: тупик решают провод или рестарт.
    ov.classList.add('stuck');
    const can = G.s && G.s.spare < CFG.SPARE_PER_LEVEL && wireGate() !== 'locked', undoFree = G.s && G.s.hist.length && undoGate() === 'free';
    const unit = R.unit[0].toUpperCase() + R.unit.slice(1);
    card.innerHTML = `<h2>Out of moves</h2>${can ? oomArt() + '<p>Add a ' + R.unit + ' and keep going.</p>' : '<p>Start the level again.</p>'}
      <div class="col">${can ? `<button class="go big${spareNeedsAd() ? ' adon' : ''}" data-act="spare">${ICON.plus}${unit}${AD_BADGE}</button>` : ''}${undoFree ? `<button class="go" data-act="undo">${ICON.undo}Undo</button>` : ''}<button class="stop${can || undoFree ? '' : ' big'}" data-act="retry">${ICON.restart}Restart</button></div>`;
  }
  if (screen === 'ad'){
    card.innerHTML = `<div class="adbox">AD</div><p>Ad playing…</p><div class="adbar"><i style="animation-duration:${RC.AD_MS}ms"></i></div>${payload === 'interstitial' ? '' : '<div class="col"><button data-act="ad-close">No thanks</button></div>'}`;
  }
}
// Экран приложения с политикой приватности, согласием и поддержкой: pfSdk.shell.settings() (есть только в обёртке) — строка в паузе.
// oomArt: маленькая анимация к «+ Wire» — абстрактные провода от двух стен, новый провод вырастает от левой стены (искра на конце),
// красная лампа перелетает на него. Лампы — те же спрайты (artSrc: в сборке — data-URL).
function oomArt(){
  const b = (c, x, y) => `<image href="${artSrc('bulb-on-' + COLOR_NAMES[c])}" x="${x - 7}" y="${y}" width="14" height="23"/>`;
  const wire = (d) => `<path d="${d}" stroke="#2a5a40" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#6fae82" stroke-width="1.1" fill="none" stroke-linecap="round" transform="translate(0,-.7)"/>`;
  return `<svg class="oom-art" viewBox="0 0 240 118" aria-hidden="true">
    <rect x="0" y="4" width="6" height="110" rx="3" fill="#3b4258"/><rect x="234" y="4" width="6" height="110" rx="3" fill="#3b4258"/>
    ${wire('M6 16 Q60 22 114 16')}${b(0, 26, 18)}${b(1, 50, 19)}${b(1, 74, 19)}
    ${wire('M234 44 Q180 50 126 44')}${b(1, 214, 46)}${b(0, 190, 47)}${b(2, 166, 47)}
    <path d="M6 80 Q60 86 114 80" stroke="#8a86b8" stroke-width="2" stroke-dasharray="4 6" fill="none" opacity=".45"/>
    <path class="grow" d="M6 80 Q60 86 114 80" stroke="#ffd772" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <g class="tip"><circle cx="8" cy="80" r="7" fill="#fff1c2" opacity=".55"/><circle cx="8" cy="80" r="3.2" fill="#fff"/></g>

function lampPose(l, t){

    // Подхват за DRAG_GRAB_MS (от места, где лампу застало касание, — хоть в полёте), дальше лампа идёт за пальцем жёстко, в тот же кадр:

    const q = l.si - (V.cont[l.ci].length - G.selN), n = G.selN, k = ease((t - dg.t0) / dur(CFG.DRAG_GRAB_MS)), f = l.dragFrom || { x, y: y - liftY };

// hurry: лампу тронули в полёте (выбрали её провод) — она не доигрывает дугу, а за FLY_HURRY_MS приходит на место, уже приподнятая.

// --- частицы и кольца: положение считается от t0 аналитически (абсолютное время, §4) ---

// --- уровень и ходы ---

// --- интро уровня (18.11, Андрей: «старт уровня более сатисфайный — вытягиваются провода, появляются шатаются лампочки, вспыхивая и гаснут») ---

function liftWhy(ci){ const s = G.s, t = s.tubes[ci]; if (!t || !t.length) return ''; return s.plug === ci ? 'plug' : s.ice === ci ? 'ice' : (topLamp(t) & ICE) ? 'frost' : ''; }

// bad: отказ — отклик по причине: вилка дёргается и гудит, лампы её цвета вспыхивают; лёд звенит; патрон вспыхивает силуэтами (провод трясётся);

// Тап по контейнеру: выбрать, снять выбор, перенести или переключить выбор.
function tapContainer(ci){

  if (G.sel < 0){ if (liftable(ci)) select(ci); else if (liftWhy(ci)) bad(ci, liftWhy(ci)); return true; }

  for (const m of cands){ const s2 = applyMove(s, m); if (isWin(s2)) return m; const r = solveInfo(s2, { nodes: CFG.HINT_NODES, weight: CFG.HINT_WEIGHT }); if (r.path || !r.complete) return m; }
  return null;
}
// lessonMove: ход, который показывает рука урока, или null. Рука — только на первом шаге урока и только на настоящий ход:
//   первый уровень — первый ход, пока не собрана первая гирлянда (рука идёт за выбором игрока);
//   тёмная — ход, который открывает тёмную лампу; перламутровая — посадить её на чужой цвет; патрон — свой цвет на его провод
//   (все три — только до первого хода на уровне);
//   иней, обледеневший провод — после того как игрок в них упёрся: ход, который собирает гирлянду, если он есть прямо сейчас;
//   вилка — после упора: ход, который собирает гирлянду цвета вилки; коробка и разная длина — до первого хода: ход, который собирает гирлянду.
//   На уровне сразу после вводного руки нет (§4 «урок ≠ понял»: самостоятельная проверка на другой раскладке), блик — если правило не прожито.
function lessonMove(){
  const s = G.s; if (!s || isWin(s)) return null;
  const Ls = G.lesson, base = s.li === 0 && !s.done.length;
  if (!base && !(Ls && Ls.keys.some(k => !learned(k)))) return null;
  const key = s.moves + '|' + s.tubes.join('|') + '|' + G.sel + '|' + (Ls ? Ls.bump : '');
  if (G.handCache && G.handCache.key === key) return G.handCache.m;
  const P = posOf(s), evOf = (m) => Object.assign({ ev: stepPos(s, P, m).ev }, m), ms = legalMoves(s).map(evOf);
  const rank = (m) => m.ev.completed ? 0 : m.ev.merge && !m.ev.wild ? 1 : 2, byRank = (arr) => arr.sort((x, y) => rank(x) - rank(y));
  let m = null;
  if (base){
    if (G.sel >= 0){ const from = []; for (let b = 0; b < s.tubes.length; b++){ const n = canMove(s, G.sel, b); if (n) from.push(evOf({ a: G.sel, b, n })); } m = safeMove(s, byRank(from)); }
    else m = hintMove(s).move;
  } else for (const k of Ls.keys){
    if (learned(k)) continue;
    let c = [];
    if (k === 'dark' && !s.moves) c = ms.filter(x => x.ev.reveal);
    if (k === 'wild' && !s.moves){ c = ms.filter(x => x.ev.wild && (topLamp(s.tubes[x.a]) & COLOR) === WILD); if (!c.length) c = ms.filter(x => x.ev.wild); }
    if (k === 'sock' && !s.moves) c = ms.filter(x => !s.tubes[x.b].length && s.sock[x.b] >= 0);
    if (INTRO_N[k] && levelNo(s) === INTRO_N[k] + 1) continue;
    if ((k === 'frost' || k === 'iceWire') && Ls.bump === k) c = ms.filter(x => x.ev.completed);
    if (k === 'plug' && Ls.bump === k) c = ms.filter(x => x.ev.completed && x.ev.col === s.plugCol);
    if ((k === 'box' || k === 'len') && !s.moves) c = ms.filter(x => x.ev.completed);
    m = safeMove(s, byRank(c));
    if (m) break;
  }
  if (m && !base && G.sel >= 0 && G.sel !== m.a) m = null;      // игрок поднял другие лампы — рука не спорит
  G.handCache = { key, m: m ? { a: m.a, b: m.b } : null };
  return G.handCache.m;
}
// autoHand: рука урока появляется после паузы без ввода и исчезает с первым касанием (noteInput)
function autoHand(t){
  const m = lessonMove();
  if (m){ G.hint = { a: m.a, b: m.b, t0: t, until: 0, auto: true }; log('fx.start', 'hand', m.a + '>' + m.b); }
  else G.idleT = t;
}
function checkStuck(){
  if (!G.s || G.screen !== 'game' || isWin(G.s) || V.pending > 0 || !isStuck(G.s) || G.oom) return;
  log('event', 'stuck', 'moves=' + G.s.moves);
  after(450, () => { if (G.s && G.screen === 'game' && isStuck(G.s) && !G.oom) oomShow(); });
}
// oomShow: «Out of moves» прилетает снизу вверх с грустным звуком, через OOM_MS — карточка (если тупик ещё есть: игрок мог взять провод или отменить ход)
function oomShow(){
  const el = $('oom'), s0 = G.s; G.oom = true; Sound.sad(); buzz([30, 60, 40]);
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); log('fx.start', 'oom');
  after(CFG.OOM_MS, () => { el.classList.remove('show'); G.oom = false; log('fx.end', 'oom'); if (G.s && G.s === s0 && G.screen === 'game' && isStuck(G.s)) goto('stuck'); });
}// Отмена в любой момент, кроме победы: ядро откатывается сразу, картинка собирается заново, а лампы отменённого хода летят назад
// с того места, где их застала отмена (в полёте, на проводе, в улетающей гирлянде, на итоговом проводе).
function undo(paid){
  if (!G.s || G.ending || now() < G.lockUntil || !G.s.hist.length) return;
  const g = undoGate(); if (g === 'locked') return;
  if (g === 'ad' && !paid){ adPlace = 'undo'; showRewarded(() => undo(true)); return; }   // каждое нажатие — ролик; награда только в onReward
  coachUsed('undo');
  const L = G.lasts.pop() || null, t = now();
  let back = null;
  if (L){
    const gq = L.completed ? V.gone.find(q => q.col === L.col) : null;
    const old = L.completed ? (gq ? gq.arr : V.top.filter(l => l.col === L.col)) : (V.cont[L.b] || []);    // лампы на проводе-цели в порядке мест; у гирлянды — вся она
    back = old.map(l => { const p = lampPose(l, t); return { x: p.x, y: p.y, sc: twVal(l.sc, t) }; });
  }
  G.s = undoMove(G.s); syncVisual(); Sound.undo(); log('input', 'undo', 'moves=' + G.s.moves); hud();
  if (L && V.cont[L.a]){
    const A = V.cont[L.a], B = V.cont[L.b] || [], nb = back.length, fl = [];
    for (let k = 0; k < L.n && k < A.length; k++) fl.push([A[A.length - 1 - k], back[nb - L.n + k]]);      // перенесённые лампы: первая снятая села на цель первой
    if (L.completed) for (let j = 0; j < B.length && j < nb - L.n; j++) fl.push([B[j], back[j]]);           // остальная гирлянда возвращается на свой провод
    for (const [l, p0] of fl){
      if (!p0) continue;
      l.sc = tw(p0.sc); twTo(l.sc, 1, t, CFG.UNDO_FLY_MS); l.flashT = t; l.flashK = 0.4;
      startFly(l, p0, 0, 'back', CFG.UNDO_FLY_MS);
      l.landCb = () => { l.landed = true; l.landT = now(); relightArr(V.cont[l.ci], now()); };
    }
    relight(L.a, t, true); if (L.completed) relight(L.b, t, true);
    kick(L.a, 3);
  }
}
// Запасной провод: до wire_unlock_level нет, на нём бесплатно (с рукой), дальше — за ролик (showRewarded, место spare).
function useSpare(paid){
  if (!G.s || G.ending || now() < G.lockUntil) return;
  if (G.s.spare >= CFG.SPARE_PER_LEVEL){ toast(G.s.v === 'a' ? 'Spare wire already added' : 'Spare jar already added'); return; }
  const g = wireGate(); if (g === 'locked' && !G.s.spare) return;
  if (g === 'ad' && !paid){ adPlace = 'spare'; showRewarded(() => grantSpare(true)); return; }
  grantSpare(!!paid && g === 'ad');
}
// grantSpare(fromAd): 18.11 (Андрей: «стейт записываем, что даём, до — чтобы при проблеме с ревардом не потерялось»).
// Награда сразу — в ядре и в сохранении (G.save.gift: провод на этот уровень; если игра перезагрузится посреди уровня, startLevel вернёт его),
// а эффект — провод вырастает от стены, искры, вспышка, звук — играет, когда игра снова видна (REWARD, render): после ролика, а не под ним.
const REWARD = { fx: null };
function grantSpare(fromAd){
  if (!G.s || G.s.spare >= CFG.SPARE_PER_LEVEL) return;
  coachUsed('wire');
  if (G.sel >= 0) select(-1, true);
  G.s = addSpare(G.s); G.lasts.push(null); V.cont.push([]); layout();
  const i = V.cont.length - 1;
  if (fromAd && G.s.v === 'a'){ G.save.gift = { wire: levelNo(G.s) }; save(); }
  V.bornT[i] = 1e15; V.bornD[i] = CFG.SPARE_GROW_MS;          // провод записан, но ещё не нарисован — вырастет в spareFx
  log('event', 'spare', 'containers=' + V.cont.length + (fromAd ? ' reward' : '')); G.idleT = G.inputT = now(); G.hint = null; hud();
  if (fromAd) REWARD.fx = { i, since: 0 }; else spareFx(i);
}
// spareFx: провод вырастает от стены с искрой на конце; вырос — патроны щёлкают, кольца, искры, тёплая вспышка, пружинка
function spareFx(i){
  REWARD.fx = null; if (!GEO.cont[i] || !G.s) return;
  const g = GEO.cont[i], t = now(); V.bornT[i] = t; V.bornD[i] = CFG.SPARE_GROW_MS;
  Sound.grow(); buzz(15); log('fx.start', 'spare.grow', 'c=' + i);
  burst(g.x0, g.y, [PAL.warm, '#ffffff'], 10, 120, { life: 420, size: 6, g: 100 });
  after(CFG.SPARE_GROW_MS, () => { if (!GEO.cont[i]) return; const c = contCenter(i), e = wireEnd(i);
    ring(e.x, e.y, PAL.warm, 6, 60, 480, 3); ring(c.x, c.y, PAL.warm, 12, 120, 640, 3); burst(e.x, e.y, [PAL.warm, '#ffffff', PAL['wire-hi']], 18, 200, { life: 560, size: 7, g: 200 });
    G.flash = { t0: now(), d: dur(560), col: PAL.warm, x: c.x, y: c.y, a: 0.26 }; kick(i, 4); buzz([10, 20, 10]); log('fx.end', 'spare.grow'); });
}// Подсказка по кнопке: первые RC.HINTS_FREE на всю игру бесплатно, дальше — за ролик (место hint). Если хода нет — ролик не нужен.
// Рука урока и мигание лампочки (auto) — всегда бесплатно.
function showHint(auto, paid){
  if (!canInput()) return;
  const h = hintMove(G.s);
  if (!auto && h.move && !paid && hintNeedsAd()){ adPlace = 'hint'; showRewarded(() => showHint(false, true)); return; }
  if (!auto && h.move && !paid && G.v === 'a'){ G.save.hints++; save(); hud(); }
  if (!auto) G.inputT = now();
  if (!auto) log('input', 'hint', h.move ? h.move.a + '>' + h.move.b : h.dead ? 'dead' : 'none');
  if (h.move){ G.hint = { a: h.move.a, b: h.move.b, t0: now(), until: auto ? 0 : now() + dur(CFG.HINT_SHOW_MS), auto: !!auto }; log('fx.start', 'hint'); }
  else if (!auto) toast(h.dead ? "Can't finish from here — undo a move" : 'No hint here');
  else G.idleT = now();
}

// --- ввод: Pointer Events, порог тап/драг, pointercancel = pointerup (§3) ---
// Темп: всё решается на КАСАНИИ, а не на отпускании — выбор, ход, отказ, снятие выбора. Отпускание значит что-то только для
// перетаскивания. Поэтому два пальца внахлёст (второй коснулся цели, пока первый ещё лежит на источнике) не теряют ход,
// а полёт прошлых ламп ввод не запирает: ядро уже впереди, лампы долетают по своей очереди и подстраиваются под новое состояние.
function toVirtual(e){ const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
// dragAim: середина несомой группы. Цель перетаскивания выбирается по ней, а не по пальцу: лампы нарисованы выше пальца, игрок целится ими.
function dragAim(d){ return { x: d.x, y: d.y - CFG.DRAG_GAP - bulbH() * 0.5 }; }
// contDist: расстояние от точки до ряда ламп контейнера (вариант a — отрезок провода на высоте середины ламп; b — колба с зоной над горлышком)
function contDist(g, p){
  if (G.s.v === 'a'){
    const xa = Math.min(g.x0, g.x0 + g.dir * g.len), xb = Math.max(g.x0, g.x0 + g.dir * g.len);
    return Math.hypot(p.x < xa ? xa - p.x : p.x > xb ? p.x - xb : 0, p.y - (g.y + bulbH() * (0.5 - CFG.BULB_HOOK_K) + 2));
  }
  const top = g.yBot - g.h - CFG.B_ROW_GAP * GEO.k * 0.9;
  return Math.hypot(Math.max(0, Math.abs(p.x - g.x) - GEO.tw / 2), p.y < top ? top - p.y : p.y > g.yBot ? p.y - g.yBot : 0);
}
// dropTarget(p — перетаскивание): куда сядут лампы, если отпустить сейчас. to — ближайший ПОДХОДЯЩИЙ контейнер в радиусе прилипания (у него фора перед
// неподходящим соседом и липкость, если он уже подсвечен); no — лампа прямо над неподходящим (отпустил — мягкий отказ);
// оба −1 — лампа над своим проводом или в пустоте (вернётся на место).
// Меряется от «несомой колонки» — отрезка от середины лампы до пальца: лампа в приоритете, палец со штрафом DROP_FINGER_PEN.
// Так садится и тот, кто целится лампой (она выше пальца), и тот, кто по привычке кладёт на провод палец.
function carryDist(g, d){
  const lamp = dragAim(d);
  return Math.min(contDist(g, lamp), contDist(g, { x: d.x, y: (lamp.y + d.y) / 2 }) + CFG.DROP_FINGER_PEN * 0.5, contDist(g, d) + CFG.DROP_FINGER_PEN);
}
function dropTarget(p, cur){
  const s = G.s, from = G.sel, isA = s.v === 'a', unit = isA ? GEO.rowH : GEO.tw + CFG.B_GAP * GEO.k;
  let bv = -1, dv = 1e9, bn = -1, dn = 1e9;
  for (const g of GEO.cont){
    if (g.i === GEO.ghost) continue;
    let d = carryDist(g, p);
    if (g.i !== from && canMove(s, from, g.i)){ if (g.i === cur) d -= CFG.DROP_STICK; if (d < dv){ dv = d; bv = g.i; } }
    else if (d < dn){ dn = d; bn = g.i; }
  }
  if (bv >= 0 && dv <= unit * CFG.DROP_SNAP_K && dv <= dn + (bn === from ? 0 : unit * CFG.DROP_BIAS_K)) return { to: bv, no: -1 };
  if (bn >= 0 && bn !== from && dn <= (isA ? GEO.rowH * 0.5 : CFG.HIT_PAD)) return { to: -1, no: bn };
  return { to: -1, no: -1 };
}
function startDrag(d, p){
  const t = now();
  for (const l of selLamps()){ const q = lampPose(l, t); l.dragFrom = { x: q.x, y: q.y }; if (l.fly){ l.fly = null; l.flyId++; l.landCb = null; l.landed = true; } }   // лампу можно подхватить и в полёте
  G.drag = { x: p.x, y: p.y, t0: t, lt: t, vx: 0, over: -1, overT: t, no: -1, armed: false };
  if (G.hint && G.hint.auto) G.hint = null;
  log('input', 'drag.start', 'c=' + d.ci);
}
// retarget: провод под несомой лампой сменился — подсветка, тихий тик и толчок вибрации («навёлся»)
function retarget(){
  const g = G.drag, tg = g.armed ? dropTarget(g, g.over) : { to: -1, no: -1 };
  g.no = tg.no;
  if (tg.to !== g.over){ g.over = tg.to; g.overT = now(); if (tg.to >= 0){ Sound.aim(); buzz(6); kick(tg.to, 1.2); } }
}
// endDrag: отпустили (p — где; null — касание сорвано, берём последнее место). Над подсвеченным проводом — ход (и при срыве тоже:
// игрок видел подсветку, а отмена бесплатная); над неподходящим — мягкий отказ; иначе лампы возвращаются.
// Не «взведённое» перетаскивание (палец дрогнул на тапе) — это тап: лампы остаются приподнятыми.
function endDrag(d, p, cancel){
  const g = G.drag, from = G.sel, lamps = selLamps(), t = now();
  if (p){ g.x = p.x; g.y = p.y; if (!g.armed && Math.hypot(p.x - d.x, p.y - d.y) > CFG.DRAG_ARM) g.armed = true; }
  const tg = g.armed ? dropTarget(g, g.over) : { to: -1, no: -1 };
  for (const l of lamps) lampPose(l, t);                  // где лампы сейчас — оттуда они полетят
  G.drag = null;
  if (tg.to >= 0 && canInput()){ log('input', 'drop', from + '>' + tg.to + (cancel ? ' cancel' : '')); doMove(from, tg.to); return; }
  const keep = !g.armed && !d.wasSel;

    startFly(l, { x: l.px, y: l.py }, 0, 'back', 200); if (keep) l.lift = tw(1);
    l.landCb = () => { l.landed = true; relightArr(V.cont[l.ci], now()); };

cv.addEventListener('pointerdown', (e) => {
  Sound.init();
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (G.drag){ if (!e.isPrimary) return; if (G.down) endDrag(G.down, null, true); G.down = null; }   // второй палец перетаскиванию не мешает; новое первое касание при «висящем» старом — старое сорвано
  introSkip();
  if (!canInput()){ skipWin(); return; }
  const p = toVirtual(e), ci = containerAt(p), d = { id: e.pointerId, x: p.x, y: p.y, ci, moved: false, picked: false, wasSel: false };
  G.down = d;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (ci >= 0 && G.sel === ci){ noteInput(); d.picked = d.wasSel = true; }                   // лампы уже приподняты: потянул — понёс, отпустил на месте — положил обратно
  else if (ci >= 0 && G.sel < 0 && liftable(ci)){ noteInput(); select(ci); d.picked = true; }   // лампы приподнимаются сразу под пальцем
  else { tapContainer(ci); if (ci >= 0 && G.sel === ci) d.picked = true; }                    // ход, отказ, снятие выбора — на касании; после отказа выбор перескочил сюда — можно сразу нести
});
cv.addEventListener('pointermove', (e) => {
  const d = G.down; if (!d || e.pointerId !== d.id) return;
  const p = toVirtual(e), far = Math.hypot(p.x - d.x, p.y - d.y);
  if (!d.moved && far > CFG.DRAG_PX){ d.moved = true; if (d.picked && G.sel === d.ci && canInput()) startDrag(d, p); }
  const g = G.drag; if (!g) return;
  const t = now(), dt = Math.max(1, t - g.lt);
  g.vx += ((p.x - g.x) / dt - g.vx) * Math.min(1, dt / 50); g.lt = t; g.x = p.x; g.y = p.y;
  if (!g.armed && far > CFG.DRAG_ARM) g.armed = true;
  retarget();
});
function onUp(e){
  const d = G.down; if (!d || e.pointerId !== d.id) return;
  G.down = null;
  const cancel = e.type !== 'pointerup';
  if (G.drag){ endDrag(d, cancel ? null : toVirtual(e), cancel); return; }
  if (cancel) return;
  if (d.wasSel && G.sel === d.ci && canInput()){ noteInput(); select(-1); }                   // тап по уже приподнятым лампам — положить на место
}
cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp); cv.addEventListener('lostpointercapture', onUp);

// Рестарт в шапке убран (фидбэк Андрея 18.11: «кнопку рестарт унести в настройки») — он в паузе (красный) и в карточке «Out of moves».
// Нажатие любой кнопки: проседает с касания (класс .down — :active на iOS без touch-обработчика не срабатывает) и короткая вибрация.
$('frame').addEventListener('pointerdown', (e) => { const b = e.target && e.target.closest ? e.target.closest('button') : null; if (!b || b.disabled) return; b.classList.add('down'); buzz(CFG.BTN_BUZZ_MS); });
const btnUp = () => { for (const b of document.querySelectorAll('button.down')) b.classList.remove('down'); };
['pointerup', 'pointercancel', 'blur'].forEach(t => window.addEventListener(t, btnUp));

// --- размер: resize + orientationchange + периодический пересчёт (§2) ---
// fitFrame: масштаб кадра. Окно не шире расчётного кадра (обычный телефон) или альбомное (десктоп) — масштаб 1, как раньше.

  const k = vw > CFG.FRAME_W && vh > vw ? Math.max(1, Math.min(vw / CFG.FRAME_W, vh / CFG.FRAME_MIN_H)) : 1, f = $('frame');
  if (Math.abs(k - frameK) > 0.002 || !f.dataset.fit){ frameK = k; f.dataset.fit = '1'; f.style.setProperty('--fk', k.toFixed(4)); f.classList.toggle('zoom', k !== 1); log('event', 'frame', 'window=' + vw + 'x' + vh + ' k=' + k.toFixed(3)); }
  f.classList.toggle('narrow', f.clientWidth <= CFG.FRAME_NARROW);

function fit(){
  fitFrame();

  const dpr = Math.min(window.devicePixelRatio || 1, 2, CFG.CANVAS_MAX_W / r.width), w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  DPR = dpr; scale = r.width / VW; W = VW; H = r.height / scale;
  // безопасные зоны: CSS считает их в единицах кадра (#sa), в виртуальные юниты — через ширину кадра до масштаба
  const cs = getComputedStyle($('sa')), u = VW / ($('frame').clientWidth || VW), st = (parseFloat(cs.paddingTop) || 0) * u, sb = (parseFloat(cs.paddingBottom) || 0) * u;
  const moved = Math.abs(st - SAFE.top) > 0.5 || Math.abs(sb - SAFE.bottom) > 0.5; SAFE.top = st; SAFE.bottom = sb;
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; layout(); } else if (moved) layout();
}
let fitTimer = 0;
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 140); };
window.addEventListener('resize', refit); window.addEventListener('orientationchange', refit);
setInterval(fit, 800);
// Пауза — одна на всё: кадры, звук (AudioContext.suspend) и игровые часы now() стоят, пока есть хоть одна причина
// (вкладка в фоне, реклама, обёртка). Касание, начатое до паузы, сбрасывается. Снаружи — window.TwinkleSort.pause() / resume().
const PAUSE = { why: new Set() };
function setPaused(reason, on){
  const was = PAUSE.why.size > 0; if (on) PAUSE.why.add(reason); else PAUSE.why.delete(reason);
  const is = PAUSE.why.size > 0; if (was === is) return;
  G.paused = is;
  if (is){
    pauseAt = performance.now(); Sound.suspend();
    if (G.drag && G.down) endDrag(G.down, null, true); G.down = null;
    log('event', 'pause', 'reason=' + reason);
  } else { clockSkew -= performance.now() - pauseAt; pauseAt = 0; Sound.wake(); log('event', 'resume', 'reason=' + reason); }
}
document.addEventListener('visibilitychange', () => setPaused('hidden', document.hidden));
window.addEventListener('pagehide', () => setPaused('hidden', true));
window.addEventListener('pageshow', () => setPaused('hidden', document.hidden));
window[API] = { pause: () => setPaused('api', true), resume: () => setPaused('api', false), paused: () => G.paused, version: VERSION };

// --- рендер: всё в canvas, цвета из CSS-переменных (§9) ---
const PAL = {};
function readPalette(){ const cs = getComputedStyle(document.documentElement); for (const k of ['c0', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'ice', 'gold', 'warm', 'sky1', 'sky2', 'wire', 'wire-hi', 'wire-gold', 'socket', 'glass', 'glass-fill', 'accent', 'ink', 'muted']) PAL[k] = cs.getPropertyValue('--' + k).trim(); }
const colorHex = (k) => PAL['c' + k];
const GLOW = {};
// glowSprite(color): заранее отрисованное радиальное свечение 64×64; рисуется через 'lighter'
function glowSprite(color){
  if (GLOW[color]) return GLOW[color];

  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, color); gr.addColorStop(0.22, color + 'aa'); gr.addColorStop(0.55, color + '33'); gr.addColorStop(1, color + '00');

}

function drawBackground(c, amb){

// drawBulbGlow: свечение лампы; lit 0..1 — яркость, flash — вспышка «поцелуя»/волны

const PEARL = ['#ff9ad5', '#9ad8ff', '#a8ffd0', '#d9b3ff', '#ffe3a1'];

  const size = r * CFG.GLOW_K * (0.7 + 0.3 * q.lit + 0.35 * q.flash), a = (CFG.AMBIENT + (CFG.GLOW_A - CFG.AMBIENT) * q.lit + 0.45 * q.flash) * (1 - q.dark) * (q.off ? CFG.OFF_A : 1) * (l.bx >= 0 ? 0.5 : 1);

// frostSprite: иней — силуэт лампы, залитый льдом, с кристаллами; рисуется поверх спрайта лампы с прозрачностью CFG.FROST_A
const FROST = {};
function frostSprite(name){
  if (FROST[name]) return FROST[name];
  const src = spr('bulb-off-' + name); if (!src) return null;
  const cvs = document.createElement('canvas'), k = 2; cvs.width = src.width * k; cvs.height = src.height * k;
  const g = cvs.getContext('2d'), w = cvs.width, hh = cvs.height, r = mulberry32(4242);

// drawBulb: лампочка, висящая цоколем вверх в точке (x, y), повёрнута на ang вокруг подвеса; спрайты bulb-off/bulb-on с перекрёстным переходом

function drawBulb(c, q, t){
  const l = q.l, r = GEO.r, name = COLOR_NAMES[l.col], off = spr('bulb-off-' + name), on = spr('bulb-on-' + name), h = r * CFG.BULB_H_K, top = -h * CFG.BULB_HOOK_K;

// drawGoldBadge: счётчик золотой лампы — тёмный кружок в золотом ободке с числом ходов. На каждый ход толкается, старое число
// уезжает вверх и гаснет, новое встаёт на место: видно, что убывает от хода, а не от времени. Под конец тревожится.
function drawGoldBadge(c, x, y, left, t){

// lampLook: что лампа показывает в момент t — { dark, frost, goldA } от 0 до 1 (переходы: открытие, таяние, угасание патрона)
function lampLook(l, t){
  return { dark: l.hid ? 1 : 1 - clamp01((t - l.revT) / dur(CFG.REVEAL_MS)), frost: l.ice ? 1 : 1 - clamp01((t - l.iceT) / dur(CFG.THAW_MS)),

}
// --- ВИЛКА: розетка на стене у начала провода, вилка цвета гирлянды на кабеле. Провод выключен — вилка в стороне от розетки,

// --- цикл: rAF + watchdog setInterval; безопасно, потому что время абсолютное (§4) ---
let lastFrame = 0;
// Кадр под try/catch: одно исключение в отрисовке не останавливает игру (урок «Отряда НЛО»); ошибки считаются и пишутся в журнал.
function safeRender(){ try { render(); } catch (e) { G.frameErrors++; const m = String(e && e.stack || e).slice(0, 300); if (m !== G.lastError){ G.lastError = m; console.error('[game] frame error: ' + m); } } }

setInterval(() => { if (performance.now() - lastFrame > 120 && !G.paused) safeRender(); }, 40);
